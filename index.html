  {key:'reports',title:'Berichte',cols:[T('Nummer','number','s?'),F('Projekt',r=>proj(r.projectId)?.name||''),T('Von','from','date'),T('Bis','to','date'),T('Unterschrieben von','signerName'),F('Unterschrieben am',r=>r.signedAt?fmtDT(r.signedAt):''),T('ID','id'),T('Projekt-ID','projectId','s?'),T('Einträge','entryIds','json'),T('Unterschrift','signature','s?'),T('Unterschrift-Zeit','signedAt','n?'),T('Erstellt','createdAt','n'),T('Geändert','updatedAt','n')]}];
const DEL='Gelöscht',SYS='System',ALL_TITLES=[...TABLES.map(t=>t.title),DEL,SYS];
const qn=s=>"'"+s.replace(/'/g,"''")+"'";
function toCell(v,ty){switch(ty){case'b':return v?'ja':'nein';case'json':return JSON.stringify(v??[]);case'n?':return v==null||v===''?'':+v;case'n':return+v||0;case'btype':return{h:'Stunden',eur:'Euro'}[v]||'';default:return v??''}}
function fromCell(v,ty){switch(ty){
  case'b':return v===true||/^(ja|j|x|true|1|yes)$/i.test(String(v??'').trim());
  case'json':if(Array.isArray(v))return v;try{return v?JSON.parse(v):[]}catch(e){return[]}
  case'n':{const n=parseNum(v);return isFinite(n)?n:0}
  case'n?':{if(v===''||v==null)return null;const n=parseNum(v);return isFinite(n)?n:null}
  case's?':{const s=String(v??'').trim();return s||null}
  case'btype':{const s=String(v??'').trim().toLowerCase();return s==='h'||s.startsWith('st')?'h':(s==='eur'||s==='€'||s.startsWith('eu'))?'eur':'none'}
  case'date':{if(typeof v==='number')return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10);const s=String(v??'').trim();const m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:s}
  case'time':{if(typeof v==='number'){const m=Math.round((v%1)*1440);return pad(Math.floor(m/60)%24)+':'+pad(m%60)}const s=String(v??'').trim();const m=s.match(/^(\d{1,2})[:.](\d{2})/);return m?pad(m[1])+':'+m[2]:''}
  default:return v==null?'':String(v)}}
function normEntry(x){if(x.start&&x.end){x.timeMode='range';x.minutes=entryMinutes(x.start,x.end,x.pause)}else x.timeMode='dur';return x}
function normRec(t,rec){const x={};for(const c of t.cols)if(c.k&&c.k!=='updatedAt')x[c.k]=fromCell(toCell(rec[c.k],c.ty),c.ty);if(t.key==='entries')normEntry(x);return JSON.stringify(x)}
function rowsFor(t){const sorters={entries:(a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')),reports:(a,b)=>a.createdAt-b.createdAt};
  return[t.cols.map(c=>c.h),...[...D[t.key]].sort(sorters[t.key]||((a,b)=>String(a.name).localeCompare(String(b.name)))).map(r=>t.cols.map(c=>c.fn?c.fn(r):toCell(r[c.k],c.ty)))]}
const byName=(list,name)=>{const n=String(name??'').trim().toLowerCase();return n?list.find(x=>String(x.name).trim().toLowerCase()===n):null};
function parseRemote(raw){const out={tables:{},tombs:{},settings:null,logo:null,fresh:new Set(),rowCounts:{},skipped:0};
  for(const title of ALL_TITLES)out.rowCounts[title]=(raw[title]||[]).length;
  const L={};
  for(const t of TABLES){const vals=raw[t.title]||[];const idx={};(vals[0]||[]).forEach((h,i)=>{h=String(h).trim();if(!(h in idx))idx[h]=i});const recs=[];
    for(let r=1;r<vals.length;r++){const row=vals[r]||[];if(!row.some(v=>v!==''&&v!=null))continue;
      const cell=h=>idx[h]==null?undefined:row[idx[h]];const rec={};for(const c of t.cols)if(c.k)rec[c.k]=fromCell(cell(c.h),c.ty);
      let fresh=false;if(!rec.id){if(t.key==='reports'){out.skipped++;continue}rec.id='m-'+hash(t.key+'|'+JSON.stringify(row));rec.createdAt=rec.createdAt||Date.now();rec.updatedAt=Date.now();fresh=true}
      if(FIX[t.key](rec,cell,fresh,L)===false){out.skipped++;continue}
      if(fresh)out.fresh.add(rec.id);recs.push(rec)}
    out.tables[t.key]=recs;L[t.key]=[...recs,...D[t.key]]}
  const key=Object.fromEntries(TABLES.map(t=>[t.title,t.key]));
  for(const row of(raw[DEL]||[]).slice(1)){const id=String(row[1]??'');const at=+row[2]||0;if(id&&at)out.tombs[id]={t:key[row[0]]||String(row[0]||''),at}}
  for(const row of(raw[SYS]||[]).slice(1)){if(row[0]==='Einstellungen'){try{out.settings=JSON.parse(row[1])}catch(e){}}if(row[0]==='Logo')out.logo={data:String(row[1]||''),updatedAt:+row[2]||0}}
  return out}
const FIX={
  customers:r=>!!r.name,
  activities:(r,cell,fresh)=>{if(!r.name)return false;if(fresh&&String(cell('Berechnen')??'').trim()==='')r.billable=true;return true},
  projects:(r,cell,fresh,L)=>{if(!r.name)return false;if(!r.customerId){const k=String(cell('Kunde')??'').trim();if(k&&k.toLowerCase()!=='intern'){const c=byName(L.customers,k);if(c)r.customerId=c.id}}if(!['offen','pausiert','abgeschlossen'].includes(r.status))r.status='offen';return true},
  entries:(r,cell,fresh,L)=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date))return false;
    if(!r.projectId){const p=byName(L.projects,cell('Projekt'));if(!p)return false;r.projectId=p.id}
    if(!r.activityId){const a=byName(L.activities,cell('Tätigkeit'));r.activityId=a?.id||L.activities[0]?.id||null}
    normEntry(r);if(r.timeMode==='dur'&&!r.minutes){const n=parseNum(cell('Arbeitszeit (Std.)'));if(isFinite(n))r.minutes=Math.round(n*60)}
    if(!['offen','berechnet','bezahlt'].includes(r.status))r.status='offen';
    if(fresh&&String(cell('Berechnen')??'').trim()===''){const a=L.activities.find(x=>x.id===r.activityId),p=L.projects.find(x=>x.id===r.projectId);r.billable=(a?a.billable:true)&&!!p?.customerId}
    return true},
  reports:r=>{r.signerName=r.signerName||'';return true}};
function mergeData(L,R,last){let needWrite=false,changed=false;const now=Date.now();const M={...L,tombs:{...L.tombs}};
  for(const[id,t]of Object.entries(R.tombs)){const lt=M.tombs[id];if(!lt||lt.at<t.at){M.tombs[id]=t;changed=true}}
  for(const[id,t]of Object.entries(M.tombs)){const rt=R.tombs[id];if(!rt||rt.at!==t.at)needWrite=true}
  for(const t of TABLES){const k=t.key,Lm=new Map(L[k].map(r=>[r.id,r])),Rm=new Map((R.tables[k]||[]).map(r=>[r.id,r])),res=[];
    for(const id of new Set([...Lm.keys(),...Rm.keys()])){const l=Lm.get(id),r=Rm.get(id);let w;const lu=l?.updatedAt||0,ru=r?.updatedAt||0;
      if(l&&!r){w=l;needWrite=true}
      else if(!l&&r){w=r;changed=true}
      else if(ru>lu){w=r;changed=true}
      else if(lu>ru){w=l;needWrite=true}
      else if(normRec(t,l)!==normRec(t,r)){if(lu<=last){w={...r,updatedAt:now};changed=true}else w=l;needWrite=true}
      else w=l;
      const tb=M.tombs[id];if(tb&&tb.at>=(w.updatedAt||0)){if(r)needWrite=true;if(l)changed=true;continue}
      res.push(w)}
    M[k]=res}
  const rs=R.settings,lsS=L.settings;
  if(rs&&(rs.updatedAt||0)>(lsS.updatedAt||0)){M.settings={...lsS,...rs};changed=true}
  else if(!rs||JSON.stringify(rs)!==JSON.stringify(lsS))needWrite=true;
  const seq=Math.max(lsS.reportSeq||1,rs?.reportSeq||1);if(M.settings.reportSeq!==seq){M.settings={...M.settings,reportSeq:seq};changed=true;needWrite=true}
  const rl=R.logo;if(rl&&rl.updatedAt>(L.logo.updatedAt||0)){M.logo=rl;changed=true}else if(!rl||rl.updatedAt!==(L.logo.updatedAt||0))needWrite=true;
  if(R.fresh.size)needWrite=true;
  return{data:M,needWrite,changed}}

async function api(method,url,body){if(!tokenValid())throw new AuthNeeded();let r;
  try{r=await fetch(url,{method,headers:{Authorization:'Bearer '+C.token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined})}catch(e){throw new Offline()}
  if(r.status===401){C.token=null;saveC();throw new AuthNeeded()}
  if(!r.ok){let m='';try{m=(await r.json()).error?.message||''}catch(e){}const err=new Error(r.status===404?'Die Tabelle wurde in Google Drive nicht gefunden. Wurde sie gelöscht?':r.status===403?'Google hat den Zugriff verweigert. Bitte die Verbindung trennen und neu verbinden.':`Google meldet Fehler ${r.status}${m?': '+m:''}`);err.status=r.status;throw err}
  const tx=await r.text();return tx?JSON.parse(tx):null}
let gisPromise=null;
function loadGIS(){if(window.google?.accounts?.oauth2)return Promise.resolve();if(gisPromise)return gisPromise;
  gisPromise=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>{gisPromise=null;rej(new Offline())};document.head.appendChild(s)});return gisPromise}
async function requestToken(){await loadGIS();return new Promise((res,rej)=>{
  const tc=google.accounts.oauth2.initTokenClient({client_id:clientId(),scope:SCOPES,
    callback:r=>{if(r.error){rej(new Error('Anmeldung fehlgeschlagen ('+r.error+').'));return}
      if(google.accounts.oauth2.hasGrantedAllScopes&&!google.accounts.oauth2.hasGrantedAllScopes(r,'https://www.googleapis.com/auth/drive.file')){rej(new Error('Bitte bei der Anmeldung den Zugriff auf Google Drive erlauben.'));return}
      C.token=r.access_token;C.exp=Date.now()+((+r.expires_in||3600)-120)*1000;saveC();res()},
    error_callback:e=>rej(new Error(e?.type==='popup_closed'?'Anmeldung abgebrochen.':e?.type==='popup_failed_to_open'?'Das Anmeldefenster wurde blockiert. Bitte Pop-ups für diese Seite erlauben.':'Anmeldung fehlgeschlagen.'))});
  tc.requestAccessToken({prompt:C.email?'':'consent',hint:C.email||undefined})})}
async function createSpreadsheet(){
  const s=await api('POST',SHEETS,{properties:{title:'Stundenwerk – Daten',locale:'de_DE'},sheets:ALL_TITLES.map((title,i)=>({properties:{sheetId:i+1,title,gridProperties:{frozenRowCount:1}}}))});
  await api('PATCH',`${DRIVE}/${s.spreadsheetId}?fields=id`,{appProperties:{stundenwerk:'daten'}});
  try{await api('POST',`${SHEETS}/${s.spreadsheetId}:batchUpdate`,{requests:ALL_TITLES.map((t,i)=>({repeatCell:{range:{sheetId:i+1,startRowIndex:0,endRowIndex:1},cell:{userEnteredFormat:{textFormat:{bold:true},backgroundColor:{red:.99,green:.94,blue:.79}}},fields:'userEnteredFormat(textFormat,backgroundColor)'}}))})}catch(e){}
  return{id:s.spreadsheetId,url:s.spreadsheetUrl,created:true}}
let sheetsChecked=false;
async function ensureSheets(){if(sheetsChecked)return;const meta=await api('GET',`${SHEETS}/${C.sheetId}?fields=properties.title,spreadsheetUrl,sheets.properties.title`);
  const have=new Set((meta.sheets||[]).map(s=>s.properties.title)),missing=ALL_TITLES.filter(t=>!have.has(t));
  if(missing.length)await api('POST',`${SHEETS}/${C.sheetId}:batchUpdate`,{requests:missing.map(title=>({addSheet:{properties:{title,gridProperties:{frozenRowCount:1}}}}))});
  if(meta.spreadsheetUrl){C.sheetUrl=meta.spreadsheetUrl;saveC()}sheetsChecked=true}
async function readRemote(){const qs=ALL_TITLES.map(t=>'ranges='+encodeURIComponent(qn(t))).join('&');
  const res=await api('GET',`${SHEETS}/${C.sheetId}/values:batchGet?${qs}&valueRenderOption=UNFORMATTED_VALUE`);const out={};ALL_TITLES.forEach((t,i)=>out[t]=res.valueRanges?.[i]?.values||[]);return out}
async function writeRemote(counts){const padTo=(rows,n,w)=>{while(rows.length<n)rows.push(Array(w).fill(''));return rows};const data=[];
  for(const t of TABLES)data.push({range:qn(t.title)+'!A1',values:padTo(rowsFor(t),counts[t.title]||0,t.cols.length)});
  const keyTitle=Object.fromEntries(TABLES.map(t=>[t.key,t.title]));
  data.push({range:qn(DEL)+'!A1',values:padTo([['Tabelle','ID','Gelöscht am'],...Object.entries(D.tombs).map(([id,t])=>[keyTitle[t.t]||t.t,id,t.at])],counts[DEL]||0,3)});
  data.push({range:qn(SYS)+'!A1',values:padTo([['Eintrag','Wert','Geändert'],['Hinweis','Diese Tabelle wird von Stundenwerk verwaltet. Neue Zeilen kannst du im Blatt „Zeiten“ unten anfügen (Datum, Von, Bis, Pause, Projekt, Tätigkeit). Spalten ab „ID“ bitte nicht ändern.',''],['Einstellungen',JSON.stringify(D.settings),D.settings.updatedAt||0],['Logo',D.logo.data||'',D.logo.updatedAt||0]],counts[SYS]||0,3)});
  await api('POST',`${SHEETS}/${C.sheetId}/values:batchUpdate`,{valueInputOption:'RAW',data})}
let syncing=false,syncAgain=false,syncTimer=null;
function setSync(s){C.status=s;renderSyncChip();if(P.view==='mehr'&&$('#cloud-state'))$('#cloud-state').innerHTML=cloudStateHtml()}
function scheduleSync(delay=2500){if(!cloudOn())return;clearTimeout(syncTimer);if(C.status==='ok'||C.status==='off')setSync('pending');syncTimer=setTimeout(sync,delay)}
async function sync(){if(!cloudOn())return;if(syncing){syncAgain=true;return}clearTimeout(syncTimer);if(!tokenValid()){setSync('auth');return}
  syncing=true;setSync('busy');const started=Date.now();
  try{await ensureSheets();const raw=await readRemote();const remote=parseRemote(raw);const m=mergeData(D,remote,C.lastSyncAt||0);
    D=m.data;D.sample=false;save();if(m.needWrite)await writeRemote(remote.rowCounts);
    C.lastSyncAt=started;C.error='';saveC();setSync('ok');
    if(m.changed&&$('#sheet').hidden&&$('#report').hidden)render();else if(m.changed)renderSyncChip();
    if(remote.skipped)toast(`${remote.skipped} Zeilen in der Google-Tabelle konnten nicht gelesen werden (z. B. Projekt unbekannt).`,'bad')}
  catch(e){if(e instanceof AuthNeeded)setSync('auth');else if(e instanceof Offline)setSync('offline');else{C.error=e.message;saveC();setSync('error')}}
  finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync(400)}}}
async function connectGoogle(){
  if(!isWeb()){toast('Google Drive funktioniert nur, wenn Stundenwerk über eine Internetadresse geöffnet wird.','bad');return}
  if(!clientId()){toast('Es fehlt noch die Google-Client-ID (Einstellungen → Einrichtung).','bad');P.view='mehr';saveP();render();return}
  if(D.sample&&!await confirmBox('Die Beispieldaten werden vorher gelöscht, damit sie nicht in deine Google-Tabelle gelangen.','Weiter'))return;
  try{setSync('busy');await requestToken();
    const me=await api('GET','https://www.googleapis.com/oauth2/v3/userinfo');C.email=me.email||'';
    const q="appProperties has { key='stundenwerk' and value='daten' } and trashed=false";
    const list=await api('GET',`${DRIVE}?q=${encodeURIComponent(q)}&orderBy=modifiedTime%20desc&pageSize=5&fields=files(id,name,webViewLink)`);
    if(D.sample){D=defaults();save()}
    let f=list.files?.[0]?{id:list.files[0].id,url:list.files[0].webViewLink,created:false}:await createSpreadsheet();
    C.sheetId=f.id;C.sheetUrl=f.url||`https://docs.google.com/spreadsheets/d/${f.id}/edit`;C.lastSyncAt=0;C.error='';saveC();sheetsChecked=false;
    await sync();
    if(C.status==='ok'){P.view=D.projects.length?P.view:'erfassen';saveP();render();toast(f.created?'Verbunden: Neue Tabelle in deinem Google Drive angelegt.':'Verbunden: Daten aus Google Drive geladen und abgeglichen.')}
    else{render();toast(C.error||'Verbunden, aber der Abgleich hat noch nicht geklappt.','bad')}}
  catch(e){if(!C.sheetId)setSync('off');else setSync('error');toast(e.message,'bad')}}
async function reauth(){try{await requestToken();await sync()}catch(e){toast(e.message,'bad');setSync('auth')}}
function disconnectGoogle(){try{if(C.token&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(C.token,()=>{})}catch(e){}
  C={clientId:C.clientId,sheetId:null,sheetUrl:'',email:'',token:null,exp:0,lastSyncAt:0,error:'',status:'off'};saveC();sheetsChecked=false;render();toast('Verbindung getrennt. Die Daten bleiben auf diesem Gerät und in der Tabelle.')}
const SYNC_UI={ok:['ok','Gespeichert','cloud'],busy:['busy','Speichert …','cloud'],pending:['busy','Speichert …','cloud'],offline:['warn','Offline','cloudOff'],auth:['warn','Anmelden','cloudOff'],error:['bad','Sync-Fehler','cloudOff'],off:['ok','Gespeichert','cloud']};
function renderSyncChip(){const el=$('#sync-chip');if(!cloudOn()){el.hidden=true;return}const[cls,l,ic]=SYNC_UI[C.status]||SYNC_UI.ok;el.hidden=false;el.className='hchip sync-chip '+cls;el.innerHTML=`${Is(ic)}<span>${l}</span>`;el.title='Google Drive: '+l;el.setAttribute('aria-label','Google Drive: '+l)}

function cloudCard(){const web=isWeb(),cid=clientId();let body;
  const intro='<p>Mit Google Drive liegen alle Zeiten, Kunden und Projekte in einer Google-Tabelle in deinem eigenen Konto. So arbeitest du auf Handy, Tablet und PC mit denselben Daten. Ohne Netz geht alles weiter, abgeglichen wird später.</p>';
  if(!web)body=intro+`<div class="banner warn"><div><b>Nur online verfügbar</b>Das funktioniert, sobald Stundenwerk über eine Internetadresse (https://…) aufgerufen wird. Bei einer lokal geöffneten Datei erlaubt Google keine Anmeldung.</div></div>`;

  else body=`<div id="cloud-state">${cloudStateHtml()}</div>
    <div class="grid2"><button class="btn" data-act="sync-now">${Is('swap')} Jetzt abgleichen</button><a class="btn" href="${esc(C.sheetUrl)}" target="_blank" rel="noopener">${Is('ext')} Tabelle öffnen</a></div>
    <details class="more"><summary>Direkt in der Tabelle arbeiten</summary><div class="more-body"><p class="muted">Im Blatt „Zeiten“ kannst du Notiz, Status, Von, Bis, Pause und km ändern oder unten neue Zeilen anfügen. Für eine neue Zeile reichen Datum, Von, Bis und der Projektname, so wie er im Blatt „Projekte“ steht. Spalten ab „ID“ nicht ändern. Löschen bitte in der App. Als Excel-Datei: in Google Tabellen „Datei → Herunterladen → Microsoft Excel“.</p></div></details>
    <button class="btn small danger" data-act="cloud-disconnect" style="align-self:flex-start">Verbindung trennen</button>`;
  const dev=web&&!GOOGLE_CLIENT_ID&&!cloudOn()?`<details class="more" ${cid?'':'open'}><summary>Einrichtung (einmalig)</summary><div class="more-body"><div class="field"><label for="cid">Google OAuth-Client-ID</label><input id="cid" data-cloud="clientId" value="${esc(C.clientId)}" placeholder="1234-abc.apps.googleusercontent.com"><small>In der Google Cloud Console als „Autorisierter JavaScript-Ursprung“ eintragen: <b>${esc(location.origin)}</b></small></div></div></details>`:'';
  const legal=`<p class="muted" style="font-size:.86rem"><b>Datenschutz:</b> Stundenwerk hat keinen eigenen Server. Deine Daten liegen nur auf deinem Gerät und, wenn du es verbindest, in deinem eigenen Google-Konto. Der Anbieter von Stundenwerk kann sie nicht sehen. Für die Daten und das gewählte Konto bist du selbst verantwortlich. Für Kundendaten im Betrieb empfiehlt sich ein geschäftliches Google-Konto (Google Workspace) mit Vertrag zur Auftragsverarbeitung.</p>`;
  return`<section class="card stack"><h2>${Is('cloud')} Google Drive</h2>${body}${legal}${dev}</section>`}

/* ==== Aktionen ==== */
const ACT={
  nav:b=>{P.view=b.dataset.view;saveP();render();window.scrollTo(0,0)},
  'sel-project':b=>{ui.selProject=b.dataset.id;render()},
  'sel-activity':b=>{ui.selActivity=b.dataset.id;render()},
  'timer-start':()=>{if(!proj(ui.selProject)){toast('Bitte eine Baustelle wählen.','bad');return}startTimer(ui.selProject,ui.selActivity);render()},
  'timer-pause':()=>{const t=P.timer;if(!t)return;if(timerPaused())t.pauses[t.pauses.length-1].end=Date.now();else t.pauses.push({start:Date.now(),end:null});saveP();render()},
  'timer-stop':()=>{const e=stopTimer();render();if(e)toast(`Gespeichert: ${fmtHM(e.minutes)} Std. ${act(e.activityId)?.name||''}`,'',{label:'Ergänzen',fn:()=>openEntryEditor(e.id)})},
  'timer-switch':()=>openSwitchActivity(),
  'timer-switch-to':b=>{const t=P.timer;if(!t)return;const pid=t.projectId,e=stopTimer();startTimer(pid,b.dataset.id);ui.selActivity=b.dataset.id;closeSheet();render();toast(`${fmtHM(e.minutes)} Std. gespeichert, weiter mit ${act(b.dataset.id)?.name}`)},
  'timer-discard':async()=>{if(await confirmBox('Laufende Zeit verwerfen? Sie wird nicht gespeichert.','Verwerfen',true)){P.timer=null;saveP();render()}},
  'add-entry':b=>openEntryEditor(null,b.dataset.date?{date:b.dataset.date}:{}),
  'edit-entry':b=>openEntryEditor(b.dataset.id),
  'goto-day':b=>{P.view='eintraege';saveP();ui.range='tag';ui.anchor=b.dataset.date;render();window.scrollTo(0,0)},
  'new-project':()=>openProjectEditor(null),'edit-project':b=>openProjectEditor(b.dataset.id),
  'new-customer':()=>openCustomerEditor(null),'edit-customer':b=>openCustomerEditor(b.dataset.id),
  'new-activity':()=>openActivityEditor(null),'edit-activity':b=>openActivityEditor(b.dataset.id),
  'stamm-tab':b=>{ui.stammTab=b.dataset.t;render()},
  range:b=>{ui.range=b.dataset.r;render()},
  'range-step':b=>{const d=+b.dataset.d;if(ui.range==='tag')ui.anchor=addDays(ui.anchor,d);else if(ui.range==='woche')ui.anchor=addDays(ui.anchor,7*d);else{const x=new Date(ui.anchor.slice(0,8)+'15T12:00');x.setMonth(x.getMonth()+d);ui.anchor=isoDate(x)}render()},
  'range-today':()=>{ui.anchor=todayISO();render()},
  period:b=>{ui.period=b.dataset.p;render()},
  'report-setup':b=>openReportSetup(b.dataset.id),
  'open-report':b=>{const r=D.reports.find(x=>x.id===b.dataset.id);if(r){closeSheet();openReport(clone(r))}},
  'rep-close':()=>{$('#report').hidden=true;$('#report').innerHTML='';curRep=null;document.body.classList.remove('noscroll');render()},
  'rep-sign':()=>openSignature(),
  'rep-print':()=>{persistReport();openReport(curRep);setTimeout(()=>window.print(),150)},
  'rep-bill':()=>{const ids=new Set(curRep.entryIds);D.entries.filter(e=>ids.has(e.id)&&e.status==='offen').forEach(e=>upsert('entries',{...e,status:'berechnet'}));persistReport();openReport(curRep);toast('Als berechnet markiert')},
  'company-edit':()=>openCompanyEditor(),
  'company-done':()=>{closeSheet();if(curRep)openReport(curRep)},
  'csv-range':()=>{const[a,b]=rangeBounds();exportCSV(filteredEntries(),`stundenwerk_${a}_${b}.csv`)},
  'csv-all':()=>exportCSV(D.entries,'stundenwerk_alle.csv'),
  backup:()=>exportBackup(),
  import:()=>$('#file-import').click(),
  'logo-del':()=>{D.logo={data:'',updatedAt:Date.now()};commit();rerenderSettingsArea()},
  reset:async()=>{if(!await confirmBox('Wirklich alle Daten auf diesem Gerät löschen?','Alles löschen',true))return;D=defaults();P={...P,timer:null,lastProject:null,lastActivity:null};saveP();
    if(cloudOn())C={clientId:C.clientId,sheetId:null,sheetUrl:'',email:'',token:null,exp:0,lastSyncAt:0,error:'',status:'off'};saveC();save();P.view='erfassen';saveP();render();toast('Alle Daten auf diesem Gerät gelöscht')},
  'load-sample':()=>{seedSample();render();window.scrollTo(0,0)},
  'clear-sample':async()=>{if(!await confirmBox('Beispieldaten löschen und mit eigenen Daten beginnen?','Löschen'))return;D=defaults();P={...P,timer:null,lastProject:null,lastActivity:null,view:'erfassen'};saveP();save();render();setTimeout(()=>$('#wf-p')?.focus(),50)},
  'cloud-connect':()=>connectGoogle(),
  'cloud-reauth':()=>reauth(),
  'cloud-disconnect':async()=>{if(await confirmBox('Verbindung zu Google Drive trennen? Die Daten bleiben auf diesem Gerät und in der Google-Tabelle.','Trennen'))disconnectGoogle()},
  'sync-now':()=>sync(),
  'sync-chip':()=>{if(C.status==='auth')reauth();else if(C.status==='error'||C.status==='offline'){sync();P.view='mehr';saveP();render()}else{P.view='mehr';saveP();render()}},
  'sheet-close':()=>closeSheet()
};
function rerenderSettingsArea(){if(!$('#sheet').hidden){openCompanyEditor()}else render()}
const CHANGE={
  'sel-project':t=>{if(t.value){ui.selProject=t.value;render()}},
  'f-project':t=>{ui.fProject=t.value;render()},
  logo:async t=>{const f=t.files[0];if(!f)return;try{const img=await loadImage(f);let w=360,d='';for(;;){const s=Math.min(1,w/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);d=c.toDataURL('image/png');if(d.length>40000){const c2=document.createElement('canvas');c2.width=c.width;c2.height=c.height;const x=c2.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(c,0,0);d=c2.toDataURL('image/jpeg',.85)}if(d.length<=40000||w<=120)break;w=Math.round(w*.75)}
    D.logo={data:d,updatedAt:Date.now()};commit();rerenderSettingsArea();toast('Logo gespeichert')}catch(e){toast('Das Bild konnte nicht gelesen werden. Bitte PNG oder JPG wählen.','bad')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const fn=ACT[b.dataset.act];if(fn){e.preventDefault();fn(b,e)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'){if(!$('#confirm').hidden)return;if(!$('#sheet').hidden)closeSheet();else if(!$('#report').hidden)ACT['rep-close']()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.set){let v=t.type==='checkbox'?t.checked:t.value;if(t.dataset.num){v=parseNum(v);if(!isFinite(v)){toast('Bitte eine Zahl eintragen, z. B. 58 oder 0,60.','bad');return}}if(t.dataset.int)v=parseInt(v,10)||0;setSetting(t.dataset.set,v);commit();toast('Gespeichert');return}
  if(t.dataset.pref){P[t.dataset.pref]=t.value.trim();saveP();toast('Gespeichert');return}
  if(t.dataset.cloud){C[t.dataset.cloud]=t.value.trim();saveC();render();return}
  if(t.dataset.change)CHANGE[t.dataset.change]?.(t)});
document.addEventListener('input',e=>{if(e.target.id==='t-note'&&P.timer){P.timer.note=e.target.value;saveP()}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form!=='welcome')return;e.preventDefault();
  const pn=$('#wf-p').value.trim(),cn=$('#wf-c').value.trim();if(!pn){toast('Bitte einen Namen für die Baustelle eintragen.','bad');$('#wf-p').focus();return}
  let cid=null;if(cn)cid=upsert('customers',{id:uid(),name:cn,contact:'',street:'',zip:'',city:'',phone:'',email:'',rate:null}).id;
  const p=upsert('projects',{id:uid(),name:pn,customerId:cid,address:'',rate:null,budgetType:'none',budget:0,status:'offen'});ui.selProject=p.id;P.lastProject=p.id;saveP();commit();render();toast('Angelegt. Wähle die Tätigkeit und tippe auf Start.')});

/* ==== Timer-Anzeige ==== */
function tick(){const t=P.timer,mini=$('#mini-timer');if(!t){mini.hidden=true;return}
  const ms=timerMs(t),paused=timerPaused(t);mini.hidden=P.view==='erfassen';mini.innerHTML=`<i class="dot ${paused?'p':''}"></i>${fmtClock(ms)}`;mini.setAttribute('aria-label','Laufende Zeit '+fmtClock(ms));
  const c=$('#t-clock');if(!c)return;c.textContent=fmtClock(ms);
  const bill=defaultBillable(t.projectId,t.activityId);$('#t-line').textContent=`Pause ${fmtHM(pauseMs(t)/60000)} Std.`+(bill?` · bisher ${fmtEUR(ms/3600000*rateFor(t))}`:' · interne Arbeit')}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;tick();if(cloudOn()&&tokenValid())sync();else if(cloudOn())setSync('auth')});
window.addEventListener('online',()=>{if(cloudOn())sync()});
setInterval(()=>{if(cloudOn()&&!document.hidden&&tokenValid()&&!syncing)sync()},120000);
window.addEventListener('storage',e=>{if(e.key===KEY&&$('#sheet').hidden&&$('#report').hidden){try{D=JSON.parse(e.newValue);fixData();render()}catch(_){}}});

/* ==== Start ==== */
loadAll();
try{navigator.storage?.persist?.()}catch(e){}
if(isWeb()){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
if(cloudOn()){if(tokenValid())sync();else setSync('auth');loadGIS().catch(()=>{})}
</script>
</body>
</html>
