<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stundenwerk</title>
<meta name="description" content="Zeiterfassung für Handwerk und Kleinbetriebe. Läuft offline im Browser, optional mit Speicherung in Google Drive.">
<meta name="theme-color" content="#F2A900">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stundenwerk">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F2A900'/%3E%3Cpath d='M10 40h44M14 40v-12M24 40v-7M34 40v-12M44 40v-7M54 40v-12' stroke='%231A1300' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<!--
  STUNDENWERK – Einrichtung von Google Drive (einmalig durch den Betreiber)
  1. https://console.cloud.google.com → Projekt anlegen.
  2. „APIs & Dienste“ → Bibliothek → „Google Sheets API“ und „Google Drive API“ aktivieren.
  3. „OAuth-Zustimmungsbildschirm“ → Typ „Extern“, App-Name „Stundenwerk“, Bereiche:
     .../auth/drive.file und .../auth/userinfo.email
  4. „Anmeldedaten“ → „OAuth-Client-ID“ → Webanwendung → unter „Autorisierte JavaScript-Ursprünge“
     die Adresse eintragen, unter der Stundenwerk liegt (z. B. https://zeit.meine-firma.de).
  5. Die Client-ID unten bei GOOGLE_CLIENT_ID eintragen (oder in der App unter Einstellungen).
-->
<style>
/* Layout: Handy = eine Spalte + Tab-Leiste unten; ab 1000px Tabs im Kopf, ab 900px zwei Spalten. */
:root{
  --bg:#E8EBE9; --surface:#FFFFFF; --surface-2:#F2F4F3; --ink:#18201E; --muted:#56625F; --line:#D2D8D6;
  --accent:#F2A900; --accent-ink:#1A1300; --accent-soft:#FCEFC9;
  --ok:#1C7448; --ok-soft:#DCEFE3; --warn:#A8500C; --warn-soft:#FBE6D3; --bad:#B42318; --bad-soft:#FADFDB;
  --info:#1D5A9E; --info-soft:#DDE8F6;
  --scrim:rgba(12,18,16,.48); --shadow:0 10px 40px rgba(12,18,16,.18);
  --font-ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:Bahnschrift,"DIN Alternate","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --font-num:"Cascadia Mono","SF Mono",ui-monospace,"Roboto Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101413; --surface:#191F1D; --surface-2:#212826; --ink:#E5EAE8; --muted:#97A3A0; --line:#2E3735;
  --accent:#F5B21B; --accent-ink:#1A1300; --accent-soft:#3A2E0E;
  --ok:#52C68E; --ok-soft:#15301F; --warn:#F09A52; --warn-soft:#3A2410; --bad:#F27D73; --bad-soft:#3B1716;
  --info:#83B4EE; --info-soft:#16263A; --scrim:rgba(0,0,0,.62); --shadow:0 10px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101413; --surface:#191F1D; --surface-2:#212826; --ink:#E5EAE8; --muted:#97A3A0; --line:#2E3735;
  --accent:#F5B21B; --accent-ink:#1A1300; --accent-soft:#3A2E0E;
  --ok:#52C68E; --ok-soft:#15301F; --warn:#F09A52; --warn-soft:#3A2410; --bad:#F27D73; --bad-soft:#3B1716;
  --info:#83B4EE; --info-soft:#16263A; --scrim:rgba(0,0,0,.62); --shadow:0 10px 40px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-ui)}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.3rem} h3{font-size:1.06rem}
p{margin:0}
small,.muted{color:var(--muted)}
.tn{font-variant-numeric:tabular-nums}
svg{flex-shrink:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Kopf + Navigation */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--surface)}
.app-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.head-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.25rem;font-weight:700;white-space:nowrap;margin-right:auto;min-width:0}
.mark{width:28px;height:18px;border-radius:3px;flex-shrink:0;background-color:var(--accent);background-image:repeating-linear-gradient(90deg,var(--accent-ink) 0 2px,transparent 2px 7px);background-size:100% 40%;background-repeat:no-repeat}
.hchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:0 12px;min-height:38px;font-weight:650;font-size:.86rem;cursor:pointer;white-space:nowrap;flex-shrink:0}
.mini-timer{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.sync-chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.sync-chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.sync-chip.busy svg{animation:pulse 1.2s infinite}
@media (max-width:520px){.sync-chip.ok span,.sync-chip.busy span{display:none}.sync-chip{padding:0 9px}}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.6s infinite;flex-shrink:0}
.dot.p{background:var(--warn);animation:none}
@keyframes pulse{50%{opacity:.35}}
.tabs{display:flex}
.tab{appearance:none;border:0;background:none;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:8px;font-weight:600;position:relative;min-width:0}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tab[aria-current="page"]{color:var(--ink)}
@media (max-width:999px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tab{flex-direction:column;justify-content:center;gap:3px;min-height:62px;font-size:clamp(.6rem,2.6vw,.72rem);padding:6px 2px}
  .tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--accent)}
  main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))!important}
}
@media (min-width:1000px){
  .tabs{gap:2px;margin-left:8px}
  .tab{padding:8px 12px;border-radius:9px;min-height:42px;font-size:.92rem}
  .tab:hover{background:var(--surface-2)}
  .tab[aria-current="page"]{background:var(--surface-2);box-shadow:inset 0 -3px 0 var(--accent)}
}
main{max-width:1120px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Grundbausteine */
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.cols.two{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}}
.narrow{max-width:560px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.label{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:var(--muted)}
.btn.small{min-height:40px;padding:0 14px;font-size:.92rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.big{min-height:62px;font-size:1.1rem;border-radius:14px;width:100%}
.btn.huge{min-height:80px;font-size:1.4rem;border-radius:16px;width:100%;font-family:var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{appearance:none;border:0;background:none;width:44px;height:44px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.pill{display:inline-flex;align-items:center;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.offen{background:var(--warn-soft);color:var(--warn)}
.pill.berechnet{background:var(--info-soft);color:var(--info)}
.pill.bezahlt{background:var(--ok-soft);color:var(--ok)}
.pill.p-offen{background:var(--ok-soft);color:var(--ok)}
.pill.p-pausiert{background:var(--warn-soft);color:var(--warn)}
.banner{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.banner b{display:block}
.banner.info{background:var(--info-soft);border-color:transparent}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.ok{background:var(--ok-soft);border-color:transparent}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner > div{flex:1 1 220px;min-width:0}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.ticks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
details.more{border:1px solid var(--line);border-radius:12px}
details.more > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:650;min-height:48px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.more[open] > summary::after{transform:rotate(-135deg)}
details.more > summary small{font-weight:500}
.more-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}

/* Erfassen */
.picks{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
@media (min-width:600px){.picks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;min-height:60px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;min-width:0}
.pick:hover{border-color:var(--muted)}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--surface-2)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;position:relative}
.pick[aria-pressed="true"] .radio{border-color:var(--ink)}
.pick[aria-pressed="true"] .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.pick-t{display:flex;flex-direction:column;min-width:0}
.pick-t b,.pick-t small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.add{border-style:dashed;color:var(--muted)}
.timer{border:2px solid var(--ink)}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.clock{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:650;font-size:clamp(3rem,15vw,5.6rem);line-height:1;letter-spacing:-.03em}
.timer.paused .clock{color:var(--muted)}
.t-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.warnline{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-weight:600;font-size:.92rem}
.warnline.warn{background:var(--warn-soft);color:var(--warn)}
.warnline.bad{background:var(--bad-soft);color:var(--bad)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.wd{appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;border-radius:8px;min-width:0;color:var(--ink)}
.wd:hover{background:var(--surface-2)}
.wd-n{font-size:.75rem;font-weight:700}
.wd-bar{width:70%;max-width:28px;height:56px;background:var(--surface-2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.wd-bar i{display:block;width:100%;background:var(--ink);border-radius:4px 4px 0 0}
.wd.today .wd-bar i{background:var(--accent)}
.wd.today .wd-n{color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 4px}
.wd-h{font-size:.72rem;font-variant-numeric:tabular-nums;color:var(--muted);min-height:1.1em}

/* Einträge */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:11px;padding:3px;background:var(--surface);gap:2px;max-width:100%;overflow-x:auto}
.seg button{appearance:none;border:0;background:none;min-height:40px;padding:0 14px;border-radius:8px;font-weight:650;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.range-label{font-family:var(--font-display);font-weight:700;font-size:1.15rem;min-width:0}
.sumbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sumbar div{background:var(--surface);padding:10px 12px;min-width:0}
.sumbar span{display:block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sumbar b{font-family:var(--font-display);font-size:clamp(1.02rem,4vw,1.3rem);font-variant-numeric:tabular-nums;white-space:nowrap}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-head{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.day-head h3{font-size:1rem;white-space:nowrap}
.day-head .tn{margin-left:auto;font-size:.88rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.day.today .day-head{box-shadow:inset 4px 0 0 var(--accent)}
.day-empty{padding:12px 14px;color:var(--muted);font-size:.92rem}
.entry{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:62px}
.day-head + .entry{border-top:0}
.entry:hover{background:var(--surface-2)}
.e-time{font-variant-numeric:tabular-nums;font-size:.84rem;width:86px;flex-shrink:0;display:flex;flex-direction:column;color:var(--muted)}
.e-time b{font-family:var(--font-num);font-size:1rem;color:var(--ink)}
.e-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.e-main b,.e-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-main span{color:var(--muted);font-size:.9rem}
.e-sum{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
@media (max-width:420px){.e-time{width:58px}.e-time span{display:none}.entry{gap:10px;padding:12px}}

/* Auswertung */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:1000px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--font-display);font-size:clamp(1.3rem,4.6vw,1.9rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;margin-top:2px}
.kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hl .label,.kpi.hl small{color:var(--accent-ink);opacity:.78}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.bar-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar-row .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.92rem}
.bar{grid-column:1/-1;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ink)}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.status-grid div{border-radius:10px;padding:10px 12px;min-width:0}
.status-grid b{display:block;font-family:var(--font-display);font-size:clamp(.95rem,3.6vw,1.2rem);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-offen{background:var(--warn-soft);color:var(--warn)} .st-berechnet{background:var(--info-soft);color:var(--info)} .st-bezahlt{background:var(--ok-soft);color:var(--ok)}

/* Listen */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:14px 6px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item-main b,.item-main small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:480px){.item .btn.small span{display:none}.item .btn.small{padding:0 10px}}

/* Formulare */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lbl{font-size:.84rem;font-weight:650;color:var(--muted)}
.field small{font-size:.8rem}
input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;min-width:0;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid2 > .btn,.grid2 > a.btn{white-space:normal;text-align:center;line-height:1.2}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ink);flex-shrink:0}
.mat{display:grid;grid-template-columns:minmax(0,1fr) 72px 64px 92px 44px;gap:6px;align-items:center}
@media (max-width:560px){.mat{grid-template-columns:repeat(3,minmax(0,1fr)) 44px}.mat [data-m=name]{grid-column:1/-1}}
.mats{display:flex;flex-direction:column;gap:8px}
.ef-sum{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;font-variant-numeric:tabular-nums}
.ef-sum .tot{margin-left:auto;font-family:var(--font-display);font-size:1.3rem;font-weight:700}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-top:4px}
.sheet-actions .btn.primary{flex:1 1 200px}
.logo-prev{max-height:60px;max-width:200px;object-fit:contain;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line)}

/* Ebenen */
.layer{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#confirm{z-index:80;align-items:center}
.sheet-backdrop{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:640px;max-height:94vh;max-height:94dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 18px;border-bottom:1px solid var(--line)}
.sheet-body{overflow:auto;overscroll-behavior:contain;padding-block:16px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:800px){.layer{align-items:center}.sheet{border-radius:18px;max-height:90vh}}
.dialog{position:relative;background:var(--surface);border-radius:16px;padding:20px;max-width:440px;width:calc(100% - 32px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:var(--ink);color:var(--surface);padding:10px 12px 10px 16px;border-radius:12px;font-weight:600;width:max-content;max-width:calc(100% - 32px);transition:.2s;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}
.toast-btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer;flex-shrink:0}
@media (min-width:1000px){.toast{bottom:24px}}

/* Unterschrift */
.sigpad{position:relative;border:2px dashed var(--line);border-radius:12px;background:#fff;height:200px;touch-action:none}
.sigpad canvas{width:100%;height:100%;display:block;border-radius:10px;touch-action:none}
.sigpad span{position:absolute;left:18px;right:18px;bottom:40px;border-top:1.5px solid #9aa3a0;font-size:.78rem;color:#7a8380;padding-top:4px;pointer-events:none}

/* Regiebericht */
.report{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}
.r-bar{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.r-bar-in{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.paper-wrap{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;align-items:center}
.paper-wrap > .banner{width:100%;max-width:210mm}
.paper{background:#fff;color:#1b1f1e;width:100%;max-width:210mm;padding:clamp(18px,5vw,16mm);box-shadow:0 2px 24px rgba(0,0,0,.18);font:10.5pt/1.4 var(--font-ui);border-radius:2px}
.paper h1{font-size:17pt}
.paper h2{font-size:10pt;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.08em;color:#4a5452}
.r-head{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-start;padding-bottom:12px;border-bottom:3px solid #F2A900}
.r-logo{max-height:60px;max-width:200px;object-fit:contain}
.r-firm{font-size:9pt;color:#4a5452}
.r-firm b{color:#1b1f1e;font-size:11pt}
.r-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 24px;margin-top:16px}
.r-meta .k{font-size:8pt;text-transform:uppercase;letter-spacing:.08em;color:#6b7572;font-weight:700}
.r-tw{overflow-x:auto}
.r-t{width:100%;min-width:520px;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:9.5pt}
.r-t th{text-align:left;font-size:8pt;text-transform:uppercase;letter-spacing:.06em;color:#6b7572;border-bottom:1.5px solid #1b1f1e;padding:5px 6px}
.r-t td{border-bottom:1px solid #dde2e0;padding:6px;vertical-align:top}
.r-t .r{text-align:right;white-space:nowrap}
.r-t tfoot td{border-bottom:0;font-weight:700}
.r-tot{margin-left:auto;margin-top:14px;width:min(100%,300px);border-collapse:collapse;font-variant-numeric:tabular-nums}
.r-tot td{padding:4px 6px}
.r-tot td:last-child{text-align:right;white-space:nowrap}
.r-tot tr.g td{border-top:2px solid #1b1f1e;font-weight:800;font-size:12pt;padding-top:8px}
.r-note{font-size:8.5pt;color:#4a5452;margin-top:6px}
.r-sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}
.r-sign .sl{border-top:1.5px solid #1b1f1e;padding-top:4px;font-size:8.5pt;color:#4a5452;min-height:20px}
.r-sign .sa{height:70px;display:flex;align-items:flex-end}
.r-sign img{max-height:70px;max-width:100%}
.r-foot{margin-top:24px;padding-top:8px;border-top:1px solid #dde2e0;font-size:8pt;color:#6b7572;display:flex;gap:4px 14px;flex-wrap:wrap}
@media (max-width:560px){.r-sign{grid-template-columns:1fr}}

@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  body::before,.app-head,main,#sheet,#confirm,#toast,.r-bar,.paper-wrap > .banner{display:none!important}
  .report{position:static!important;overflow:visible!important;background:#fff!important}
  .paper-wrap{padding:0!important;display:block}
  .paper{box-shadow:none!important;max-width:none!important;padding:0!important}
  .r-tw{overflow:visible}.r-t{min-width:0}
  tr,.r-sign{break-inside:avoid}
}

<body>
<header class="app-head">
  <div class="head-in">

    <button id="sync-chip" class="hchip sync-chip" data-act="sync-chip" hidden></button>
    <button id="mini-timer" class="hchip mini-timer" data-act="nav" data-view="erfassen" hidden></button>
    <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
  </div>
</header>
<main id="view"></main>
<div id="report" class="report" hidden></div>
<div id="sheet" class="layer" hidden></div>
<div id="confirm" class="layer" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-import" accept="application/json,.json" hidden>

<script>
'use strict';
/* ==== Konfiguration ==== */
const GOOGLE_CLIENT_ID=''; // OAuth-Client-ID aus der Google Cloud Console (siehe Kommentar oben)

/* ==== Helfer ==== */
const KEY='stundenwerk.v2',PK='stundenwerk.prefs',CK='stundenwerk.cloud';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>isoDate(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoDate(d)};
const weekStart=iso=>{const d=new Date(iso+'T12:00:00');return addDays(iso,-((d.getDay()+6)%7))};
const monthStart=iso=>iso.slice(0,8)+'01';
const monthEnd=iso=>{const d=new Date(iso.slice(0,8)+'01T12:00:00');d.setMonth(d.getMonth()+1);d.setDate(0);return isoDate(d)};
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
function parseNum(v){if(typeof v==='number')return v;if(v==null)return NaN;let s=String(v).trim().replace(/\s|€/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)}
const num=(v,d=0)=>{const n=parseNum(v);return isFinite(n)?n:d};
const r2=n=>Math.round((n||0)*100)/100;
const fmtNum=(n,dec=2)=>(n||0).toLocaleString('de-DE',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const fmtEUR=n=>(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const fmtHM=min=>{min=Math.round(min||0);const s=min<0?'-':'';min=Math.abs(min);return s+Math.floor(min/60)+':'+pad(min%60)};
const fmtDay=iso=>new Date(iso+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
const fmtDayLong=iso=>new Date(iso+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
const fmtDate=iso=>new Date(iso+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtDT=ts=>new Date(ts).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'});
const fmtClock=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
function parseDuration(s){s=String(s||'').trim().toLowerCase();if(!s)return NaN;if(s.includes(':')){const [h,m]=s.split(':');return num(h)*60+num(m)}if(/m(in)?$/.test(s))return num(s.replace(/[^\d,.]/g,''),NaN);return Math.round(num(s.replace(/h$/,''),NaN)*60)}
function isoWeek(iso){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4,12);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)}
function entryMinutes(start,end,pause){let m=toMin(end)-toMin(start);if(m<0)m+=1440;return Math.max(0,m-(pause||0))}
function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

const svg=(p,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',list:'<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>',chart:'<path d="M3 20h18M6 20v-7M11 20V5M16 20v-10M21 20v-4"/>',site:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>',play:'<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>',pause:'<path d="M8 5v14M16 5v14" stroke-width="3.2"/>',stop:'<rect x="5.5" y="5.5" width="13" height="13" rx="2" fill="currentColor" stroke="none"/>',plus:'<path d="M12 5v14M5 12h14"/>',car:'<path d="M4 16v-4l2.2-5h11.6L20 12v4z"/><path d="M4 12h16M7 16v2.5M17 16v2.5"/>',box:'<path d="M3 7.5l9-4 9 4v9l-9 4-9-4z"/><path d="M3 7.5l9 4 9-4M12 11.5v9"/>',left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',up:'<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',pen:'<path d="M4 20l4.5-1 10-10-3.5-3.5-10 10z"/><path d="M13.5 6.5l3.5 3.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',print:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><path d="M7 14h10v7H7z"/>',warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',cloud:'<path d="M7 18.5h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.6A3.4 3.4 0 0 0 7 18.5z"/>',cloudOff:'<path d="M7 18.5h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.6A3.4 3.4 0 0 0 7 18.5z"/><path d="M4 4l16 16"/>',swap:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>'};
const I=k=>svg(IC[k]),Is=k=>svg(IC[k],16);

/* ==== Speicher ==== */
let canStore=true;try{localStorage.setItem('__sw','1');localStorage.removeItem('__sw')}catch(e){canStore=false}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const DEFAULT_ACTS=[['a-arbeit','Arbeit vor Ort',true],['a-anfahrt','Anfahrt',true],['a-beratung','Beratung / Aufmaß',true],['a-nacharbeit','Nacharbeit',true],['a-buero','Büro (intern)',false]];
function defaults(){return{version:2,sample:false,
  settings:{name:'',owner:'',street:'',zip:'',city:'',phone:'',email:'',taxId:'',bank:'',defaultRate:58,kmRate:0.6,rounding:15,roundMode:'up',vat:19,kleinunternehmer:false,reportSeq:1,updatedAt:0},
  logo:{data:'',updatedAt:0},customers:[],projects:[],
  activities:DEFAULT_ACTS.map(([id,name,billable])=>({id,name,billable,rate:null,updatedAt:0})),
  entries:[],reports:[],tombs:{}}}
let D=defaults();
let P={view:'erfassen',lastProject:null,lastActivity:null,worker:'',lastBackup:null,timer:null};
let C={clientId:'',sheetId:null,sheetUrl:'',email:'',token:null,exp:0,lastSyncAt:0,error:'',status:'off'};
let saveWarned=false;
function save(){if(!canStore)return;if(!ls.set(KEY,JSON.stringify(D))){if(!saveWarned){saveWarned=true;toast('Speichern fehlgeschlagen: Der Browser-Speicher ist voll oder gesperrt.','bad')}}else saveWarned=false}
function commit(){save();scheduleSync()}
const saveP=()=>ls.set(PK,JSON.stringify(P));
const saveC=()=>{const{status,...rest}=C;ls.set(CK,JSON.stringify(rest))};
function fixData(){const d=defaults();D={...d,...D};D.settings={...d.settings,...D.settings};D.logo=D.logo||{data:'',updatedAt:0};D.tombs=D.tombs||{};
  for(const k of ['customers','projects','activities','entries','reports'])D[k]=Array.isArray(D[k])?D[k]:[];
  for(const e of D.entries){e.materials=Array.isArray(e.materials)?e.materials:[];if(!e.status)e.status='offen'}}
function migrateV1(){try{const raw=ls.get('stundenwerk.v1');if(!raw)return false;const o=JSON.parse(raw),s=o.settings||{},t=Date.now(),d=defaults();
  Object.assign(d.settings,s.company||{},{defaultRate:s.defaultRate??58,kmRate:s.kmRate??0.6,rounding:s.rounding??15,roundMode:s.roundMode||'up',vat:s.vat??19,kleinunternehmer:!!s.kleinunternehmer,reportSeq:o.reportSeq||1,updatedAt:t});
  d.logo={data:'',updatedAt:0};for(const k of ['customers','projects','activities','entries','reports'])d[k]=(o[k]||[]).map(r=>{const x={...r,updatedAt:t};delete x.photos;delete x.withPhotos;if(k==='reports')x.signature=null;return x});
  d.sample=!!o.sample;D=d;fixData();P.worker=s.worker||'';P.lastProject=s.lastProject||null;P.lastActivity=s.lastActivity||null;P.lastBackup=s.lastBackup||null;if(o.timer)P.timer=o.timer;
  save();saveP();ls.del('stundenwerk.v1');return true}catch(e){return false}}
function loadAll(){try{P={...P,...JSON.parse(ls.get(PK)||'{}')}}catch(e){}try{C={...C,...JSON.parse(ls.get(CK)||'{}'),status:'off'}}catch(e){}
  const raw=ls.get(KEY);if(raw){try{D=JSON.parse(raw);fixData();return}catch(e){}}if(migrateV1())return;D=defaults()}

/* Datensätze ändern: jeder Datensatz bekommt einen Zeitstempel, Löschungen werden gemerkt (für den Abgleich) */
function upsert(coll,rec){rec.updatedAt=Date.now();const a=D[coll],i=a.findIndex(x=>x.id===rec.id);if(i<0)a.push(rec);else a[i]=rec;return rec}
function removeRec(coll,id){D[coll]=D[coll].filter(x=>x.id!==id);D.tombs[id]={t:coll,at:Date.now()}}
function setSetting(k,v){D.settings={...D.settings,[k]:v,updatedAt:Date.now()}}

const cust=id=>D.customers.find(c=>c.id===id);
const proj=id=>D.projects.find(p=>p.id===id);
const act=id=>D.activities.find(a=>a.id===id);
const custName=p=>p?.customerId?(cust(p.customerId)?.name||'Kunde gelöscht'):'intern';

/* ==== Rechenlogik ==== */
function rateFor(e){if(e.rate!=null)return e.rate;const a=act(e.activityId),p=proj(e.projectId),c=p&&cust(p.customerId);return a?.rate??p?.rate??c?.rate??D.settings.defaultRate}
function roundMin(m){const s=+D.settings.rounding;if(m<=0)return 0;if(!s)return Math.round(m);return D.settings.roundMode==='nearest'?Math.max(s,Math.round(m/s)*s):Math.ceil(m/s-1e-9)*s}
function defaultBillable(projectId,activityId){const a=act(activityId),p=proj(projectId);return(a?a.billable:true)&&!!(p&&p.customerId)}
function calc(e){const worked=e.minutes||0;const billMin=e.billable?(e.billOverride!=null?e.billOverride:roundMin(worked)):0;const rate=rateFor(e);const labor=billMin/60*rate;
  const travel=num(e.km)*D.settings.kmRate+num(e.travelFlat);const mat=(e.materials||[]).reduce((s,m)=>s+num(m.qty)*num(m.price),0);
  return{worked,billMin,rate,labor,travel,mat,total:labor+travel+mat}}
function sumUp(list){const r={worked:0,billMin:0,billWorked:0,labor:0,travel:0,mat:0,total:0};for(const e of list){const k=calc(e);r.worked+=k.worked;r.billMin+=k.billMin;if(e.billable)r.billWorked+=k.worked;r.labor+=k.labor;r.travel+=k.travel;r.mat+=k.mat;r.total+=k.total}return r}
function budgetInfo(p){if(!p||!p.budgetType||p.budgetType==='none'||!(p.budget>0))return null;const s=sumUp(D.entries.filter(e=>e.projectId===p.id));
  const used=p.budgetType==='h'?s.billMin/60:s.total;const pct=used/p.budget*100;const lvl=pct>=100?'bad':pct>=80?'warn':'ok';
  const txt=p.budgetType==='h'?`${fmtNum(used,1)} von ${fmtNum(p.budget,0)} Std.`:`${fmtEUR(used)} von ${fmtEUR(p.budget)}`;return{pct,lvl,txt}}
function budgetWarn(p){const b=budgetInfo(p);if(!b||b.lvl==='ok')return'';return`<div class="warnline ${b.lvl}">${Is('warn')}<span>Budget zu ${fmtNum(b.pct,0)} % verbraucht (${b.txt}).</span></div>`}
const matText=e=>(e.materials||[]).map(m=>`${String(m.qty).replace('.',',')} ${m.unit||''} ${m.name}`.replace(/\s+/g,' ').trim()).join('; ');
function newEntry(o={}){const e={id:uid(),createdAt:Date.now(),date:todayISO(),start:'',end:'',pause:0,minutes:0,timeMode:'range',projectId:null,activityId:null,note:'',worker:P.worker||'',billable:true,billOverride:null,km:0,travelFlat:0,materials:[],status:'offen',...o};
  if(o.billable==null)e.billable=defaultBillable(e.projectId,e.activityId);return e}

/* ==== Timer (bleibt auf dem Gerät) ==== */
const timerPaused=(t=P.timer)=>!!(t&&t.pauses.length&&t.pauses[t.pauses.length-1].end==null);
const pauseMs=(t=P.timer,now=Date.now())=>t.pauses.reduce((s,p)=>s+((p.end??now)-p.start),0);
const timerMs=(t=P.timer,now=Date.now())=>Math.max(0,now-t.startTs-pauseMs(t,now));
function startTimer(projectId,activityId){P.timer={projectId,activityId,startTs:Date.now(),pauses:[],note:''};P.lastProject=projectId;P.lastActivity=activityId;saveP()}
function stopTimer(){const t=P.timer;if(!t)return null;const now=Date.now();t.pauses.forEach(p=>{if(p.end==null)p.end=now});
  const pm=Math.round(pauseMs(t,now)/60000),start=hhmm(t.startTs),end=hhmm(now);let o={date:isoDate(new Date(t.startTs)),start,end,pause:pm,timeMode:'range',minutes:entryMinutes(start,end,pm)};
  if(now-t.startTs>=864e5||o.minutes<1)o={...o,start:'',end:'',pause:0,timeMode:'dur',minutes:Math.max(1,Math.round(timerMs(t,now)/60000))};
  const e=newEntry({...o,projectId:t.projectId,activityId:t.activityId,note:t.note||''});upsert('entries',e);P.timer=null;saveP();commit();return e}

/* ==== Ansichten ==== */
const ui={selProject:null,selActivity:null,range:'woche',anchor:todayISO(),fProject:'',period:'monat',stammTab:'projekte'};
const VIEWS=[['erfassen','Erfassen','clock'],['eintraege','Einträge','list'],['auswertung','Auswertung','chart'],['stamm','Projekte','site'],['mehr','Einstellungen','gear']];
function render(){
  $('#tabs').innerHTML=VIEWS.map(([k,l,i])=>`<button class="tab" data-act="nav" data-view="${k}" ${P.view===k?'aria-current="page"':''}>${I(i)}<span>${l}</span></button>`).join('');
  const V={erfassen:vErfassen,eintraege:vEintraege,auswertung:vAuswertung,stamm:vStamm,mehr:vMehr}[P.view]||vErfassen;
  $('#view').innerHTML=V();tick();renderSyncChip();if(P.view==='mehr'){storageInfo();if(isWeb()&&clientId())loadGIS().catch(()=>{})}}

function storageBanner(){return canStore?'':`<div class="banner bad"><div><b>Speichern ist hier nicht möglich</b>Diese Vorschau erlaubt kein Speichern. Öffne die Datei direkt in Chrome, Edge, Firefox oder Safari.</div></div>`}
function banners(){let h=storageBanner();
  if(D.sample)h+=`<div class="banner info"><div><b>Beispieldaten</b>Ein ausgedachter Maurerbetrieb zum Ausprobieren.</div><button class="btn small" data-act="clear-sample">Löschen und selbst starten</button></div>`;
  else if(!cloudOn()&&D.entries.length>=5&&(!P.lastBackup||Date.now()-P.lastBackup>7*864e5))h+=`<div class="banner warn"><div><b>Daten sichern</b>Deine Zeiten liegen nur in diesem Browser. Verbinde Google Drive oder speichere ein Backup.</div><button class="btn small" data-act="nav" data-view="mehr">Jetzt sichern</button></div>`;
  return h}

/* ---- Erfassen ---- */
function vErfassen(){
  if(!D.projects.length&&!D.entries.length&&!P.timer)return`<div class="narrow stack">${storageBanner()}${welcomeCard()}</div>`;
  return`<div class="cols two"><div class="stack">${banners()}${P.timer?timerCard():startCard()}</div><div class="stack">${todayBlock()}${weekCard()}</div></div>`}
function welcomeCard(){return`<section class="card stack">
  <h2>Willkommen bei Stundenwerk</h2>
  <p class="muted">Leg deinen ersten Auftrag an. Danach startest du die Zeit mit einem Tipp.</p>
  <form class="form" data-form="welcome" autocomplete="off">
    <div class="field"><label for="wf-p">Baustelle oder Auftrag</label><input id="wf-p" placeholder="z. B. Badsanierung Müller"></div>
    <div class="field"><label for="wf-c">Kunde <small>(optional)</small></label><input id="wf-c" placeholder="z. B. Familie Müller"></div>
    <button class="btn primary big">${I('check')} Anlegen</button>
  </form>
  <div class="divider">oder</div>
  <button class="btn" data-act="load-sample">Erst mit Beispieldaten ausprobieren</button>
  ${isWeb()&&clientId()?`<button class="btn" data-act="cloud-connect">${I('cloud')} Daten aus Google Drive laden</button>`:''}
</section>`}
function recentProjects(){const last={};for(const e of D.entries)last[e.projectId]=Math.max(last[e.projectId]||0,e.createdAt||0);
  return D.projects.filter(p=>p.status==='offen').sort((a,b)=>(last[b.id]||0)-(last[a.id]||0)||a.name.localeCompare(b.name))}
function startCard(){const open=recentProjects();
  if(!open.length)return`<section class="card stack"><h2>Keine offene Baustelle</h2><p class="muted">Alle Projekte sind abgeschlossen oder pausiert.</p><button class="btn primary big" data-act="new-project">${I('plus')} Neue Baustelle anlegen</button></section>`;
  if(!proj(ui.selProject)||proj(ui.selProject).status!=='offen')ui.selProject=proj(P.lastProject)?.status==='offen'?P.lastProject:open[0].id;
  if(!act(ui.selActivity))ui.selActivity=act(P.lastActivity)?P.lastActivity:D.activities[0]?.id;
  let shown=open.slice(0,4);if(!shown.some(p=>p.id===ui.selProject))shown=[proj(ui.selProject),...open.filter(p=>p.id!==ui.selProject).slice(0,3)];
  const rest=open.filter(p=>!shown.includes(p));
  return`<section class="card stack">
    <div class="sec-head"><h2>Zeit erfassen</h2><span class="muted">${fmtDay(todayISO())}</span></div>
    <div class="stack" style="gap:8px"><div class="label">Baustelle</div>
      <div class="picks">${shown.map(p=>`<button class="pick" data-act="sel-project" data-id="${p.id}" aria-pressed="${p.id===ui.selProject}"><span class="radio"></span><span class="pick-t"><b>${esc(p.name)}</b><small>${esc(custName(p))}</small></span></button>`).join('')}</div>
      <div class="row">${rest.length?`<select class="grow" style="flex:1 1 200px;width:auto" data-change="sel-project" aria-label="Weitere Baustelle wählen"><option value="">Weitere Baustellen (${rest.length})…</option>${rest.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`:''}<button class="btn small ghost" data-act="new-project">${Is('plus')} Neue Baustelle</button></div>
    </div>
    <div class="stack" style="gap:8px"><div class="label">Tätigkeit</div>
      <div class="chips">${D.activities.map(a=>`<button class="chip" data-act="sel-activity" data-id="${a.id}" aria-pressed="${a.id===ui.selActivity}">${esc(a.name)}</button>`).join('')}<button class="chip add" data-act="new-activity">${Is('plus')} Eigene</button></div>
    </div>
    ${budgetWarn(proj(ui.selProject))}
    <button class="btn primary huge" data-act="timer-start">${I('play')} Start</button>
    <button class="btn" data-act="add-entry">${I('plus')} Zeit nachtragen</button>
  </section>`}
function timerCard(){const t=P.timer,p=proj(t.projectId),a=act(t.activityId),paused=timerPaused();const long=timerMs()>10*3600e3;
  return`<section class="card timer stack ${paused?'paused':''}" style="gap:12px">
    <span class="state"><i class="dot ${paused?'p':''}"></i>${paused?'Pause':'Läuft seit '+hhmm(t.startTs)+' Uhr'}</span>
    <div><h2>${esc(p?.name||'Projekt gelöscht')}</h2><div class="muted">${esc(custName(p))} · ${esc(a?.name||'')}</div></div>
    <div class="clock" id="t-clock">00:00:00</div>
    <div class="muted tn" id="t-line"></div>
    ${long?`<div class="warnline warn">${Is('warn')}<span>Läuft seit über 10 Stunden. Vergessen zu stoppen? Die Zeiten kannst du danach korrigieren.</span></div>`:''}
    <input id="t-note" placeholder="Notiz, z. B. was gemacht wurde (optional)" value="${esc(t.note)}" aria-label="Notiz zum Einsatz">
    <div class="t-actions"><button class="btn big" data-act="timer-pause">${paused?I('play')+' Weiter':I('pause')+' Pause'}</button><button class="btn dark big" data-act="timer-stop">${I('stop')} Stopp</button></div>
    <div class="row"><button class="btn small" data-act="timer-switch">${Is('swap')} Tätigkeit wechseln</button><span class="grow"></span><button class="btn small ghost" data-act="timer-discard">Verwerfen</button></div>
  </section>`}
function todayBlock(){const t=todayISO();const list=D.entries.filter(e=>e.date===t).sort((a,b)=>(a.start||'').localeCompare(b.start||''));const s=sumUp(list);
  return`<section class="day today"><div class="day-head"><h3>Heute</h3><span class="tn">${list.length?fmtHM(s.worked)+' Std. · '+fmtEUR(s.total):''}</span><button class="icon-btn" data-act="add-entry" data-date="${t}" aria-label="Zeit für heute nachtragen">${I('plus')}</button></div>
  ${list.length?list.map(entryRow).join(''):'<div class="day-empty">Heute noch nichts erfasst.</div>'}</section>`}
function weekCard(){const s0=weekStart(todayISO());const days=[...Array(7)].map((_,i)=>addDays(s0,i));const mins=days.map(d=>sumUp(D.entries.filter(e=>e.date===d)).worked);const max=Math.max(480,...mins);const tot=mins.reduce((a,b)=>a+b,0);
  return`<section class="card"><div class="sec-head"><h3>Diese Woche</h3><span class="tn muted">${fmtHM(tot)} Std.</span></div>
  <div class="week">${days.map((d,i)=>`<button class="wd ${d===todayISO()?'today':''}" data-act="goto-day" data-date="${d}" aria-label="${fmtDay(d)}: ${fmtHM(mins[i])} Stunden"><span class="wd-n">${new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'short'}).slice(0,2)}</span><span class="wd-bar"><i style="height:${(mins[i]/max*100).toFixed(1)}%"></i></span><span class="wd-h">${mins[i]?fmtHM(mins[i]):''}</span></button>`).join('')}</div></section>`}
function entryRow(e){const p=proj(e.projectId),a=act(e.activityId),k=calc(e);
  const extra=[e.km?`${fmtNum(e.km,0)} km`:'',e.materials?.length?`${e.materials.length}× Material`:'',e.worker||''].filter(Boolean).join(' · ');
  return`<div class="entry" data-act="edit-entry" data-id="${e.id}" role="button" tabindex="0">
    <div class="e-time"><b>${fmtHM(e.minutes)}</b><span>${e.start?e.start+'–'+e.end:'Std.'}</span></div>
    <div class="e-main"><b>${esc(p?.name||'Ohne Projekt')}</b><span>${esc(a?.name||'')}${e.note?' · '+esc(e.note):''}</span>${extra?`<span>${esc(extra)}</span>`:''}</div>
    <div class="e-sum"><b>${e.billable||k.total?fmtEUR(k.total):'intern'}</b><span class="pill ${e.status}">${e.status}</span></div></div>`}

/* ---- Einträge ---- */
function rangeBounds(){const a=ui.anchor;if(ui.range==='tag')return[a,a];if(ui.range==='woche'){const s=weekStart(a);return[s,addDays(s,6)]}return[monthStart(a),monthEnd(a)]}
function rangeLabel(){const[a,b]=rangeBounds();if(ui.range==='tag')return fmtDayLong(a);if(ui.range==='woche')return`KW ${isoWeek(a)} · ${fmtDay(a).slice(4)}–${fmtDate(b)}`;return new Date(a+'T12:00').toLocaleDateString('de-DE',{month:'long',year:'numeric'})}
function filteredEntries(){const[a,b]=rangeBounds();return D.entries.filter(e=>e.date>=a&&e.date<=b&&(!ui.fProject||e.projectId===ui.fProject))}
function vEintraege(){const list=filteredEntries(),s=sumUp(list),[a,b]=rangeBounds();
  let days=[];if(ui.range==='monat')days=[...new Set(list.map(e=>e.date))].sort().reverse();else for(let d=a;d<=b;d=addDays(d,1))days.push(d);
  const byDay=d=>list.filter(e=>e.date===d).sort((x,y)=>(x.start||'').localeCompare(y.start||''));
  return`<div class="stack">${storageBanner()}
  <div class="toolbar"><div class="seg" role="group" aria-label="Zeitraum">${[['tag','Tag'],['woche','Woche'],['monat','Monat']].map(([k,l])=>`<button data-act="range" data-r="${k}" aria-pressed="${ui.range===k}">${l}</button>`).join('')}</div>
    <span class="row" style="gap:2px"><button class="icon-btn" data-act="range-step" data-d="-1" aria-label="Zurück">${I('left')}</button><button class="btn small ghost" data-act="range-today">Heute</button><button class="icon-btn" data-act="range-step" data-d="1" aria-label="Weiter">${I('right')}</button></span></div>
  <div class="toolbar"><h2 class="range-label grow">${rangeLabel()}</h2>
    <select data-change="f-project" style="flex:1 1 180px;width:auto;max-width:100%" aria-label="Nach Projekt filtern"><option value="">Alle Projekte</option>${D.projects.map(p=>`<option value="${p.id}" ${ui.fProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
  <div class="sumbar"><div><span>Gearbeitet</span><b>${fmtHM(s.worked)} Std.</b></div><div><span>Abrechenbar</span><b>${fmtHM(s.billMin)} Std.</b></div><div><span>Netto</span><b>${fmtEUR(s.total)}</b></div></div>
  <div class="row"><button class="btn small" data-act="report-setup" data-id="${ui.fProject}">${Is('doc')} Regiebericht</button><button class="btn small" data-act="csv-range">${Is('down')} Excel-Export (CSV)</button></div>
  ${days.length?days.map(d=>{const l=byDay(d),ds=sumUp(l);return`<section class="day ${d===todayISO()?'today':''}"><div class="day-head"><h3>${fmtDay(d)}</h3><span class="tn">${l.length?fmtHM(ds.worked)+' Std. · '+fmtEUR(ds.total):''}</span><button class="icon-btn" data-act="add-entry" data-date="${d}" aria-label="Zeit am ${fmtDay(d)} nachtragen">${I('plus')}</button></div>${l.length?l.map(entryRow).join(''):'<div class="day-empty">Keine Einträge</div>'}</section>`}).join('')
   :`<div class="card stack"><h3>Keine Einträge in diesem Zeitraum</h3><button class="btn" data-act="add-entry">${I('plus')} Zeit nachtragen</button></div>`}
  </div>`}

/* ---- Auswertung ---- */
function periodBounds(p){const t=todayISO();switch(p){case'woche':{const s=weekStart(t);return[s,addDays(s,6)]}case'monat':return[monthStart(t),monthEnd(t)];case'vormonat':{const d=addDays(monthStart(t),-1);return[monthStart(d),monthEnd(d)]}case'jahr':return[t.slice(0,4)+'-01-01',t.slice(0,4)+'-12-31'];default:return['0000-01-01','9999-12-31']}}
function vAuswertung(){const[a,b]=periodBounds(ui.period);const list=D.entries.filter(e=>e.date>=a&&e.date<=b);const s=sumUp(list);const ratio=s.worked?s.billWorked/s.worked*100:0;
  const st=k=>sumUp(list.filter(e=>e.status===k)).total;
  const byP={};for(const e of list)(byP[e.projectId]=byP[e.projectId]||[]).push(e);
  const pRows=Object.entries(byP).map(([id,l])=>{const x=sumUp(l);return{n:proj(id)?.name||'Ohne Projekt',v:x.total,h:x.worked}}).sort((x,y)=>y.v-x.v||y.h-x.h);const maxV=Math.max(1,...pRows.map(r=>r.v));
  const budgets=D.projects.filter(p=>p.status!=='abgeschlossen').map(p=>({p,b:budgetInfo(p)})).filter(x=>x.b).sort((x,y)=>y.b.pct-x.b.pct);
  return`<div class="stack">
  <div class="toolbar"><div class="seg" role="group" aria-label="Zeitraum">${[['woche','Woche'],['monat','Monat'],['vormonat','Vormonat'],['jahr','Jahr'],['alles','Gesamt']].map(([k,l])=>`<button data-act="period" data-p="${k}" aria-pressed="${ui.period===k}">${l}</button>`).join('')}</div>${ui.period!=='alles'?`<span class="muted tn">${fmtDate(a)} – ${fmtDate(b)}</span>`:''}</div>
  <div class="kpis">
    <div class="kpi"><div class="label">Gearbeitet</div><div class="v">${fmtHM(s.worked)} Std.</div><small>${list.length} Einträge</small></div>
    <div class="kpi"><div class="label">Für Kunden</div><div class="v">${fmtNum(ratio,0)} %</div><small>${fmtHM(s.billWorked)} Std. abrechenbar</small></div>
    <div class="kpi hl"><div class="label">Umsatz netto</div><div class="v">${fmtEUR(s.total)}</div><small>inkl. Material und Anfahrt</small></div>
    <div class="kpi"><div class="label">Noch offen</div><div class="v">${fmtEUR(st('offen'))}</div><small>nicht berechnet</small></div>
  </div>
  <div class="cols two">
    <section class="card"><h3>Umsatz nach Projekt</h3>${pRows.length?`<div class="bars">${pRows.map(r=>`<div class="bar-row"><span class="n">${esc(r.n)}</span><span class="v">${fmtHM(r.h)} Std. · <b>${fmtEUR(r.v)}</b></span><div class="bar"><i style="width:${(r.v/maxV*100).toFixed(1)}%"></i></div></div>`).join('')}</div>`:'<p class="muted" style="margin-top:8px">Keine Einträge im Zeitraum.</p>'}</section>
    <div class="stack">
      <section class="card"><h3>Abrechnungsstand</h3><div class="status-grid">${['offen','berechnet','bezahlt'].map(k=>`<div class="st-${k}"><span class="label" style="color:inherit">${k}</span><b>${fmtEUR(st(k))}</b></div>`).join('')}</div></section>
      <section class="card"><h3>Budgets</h3>${budgets.length?`<div class="bars">${budgets.map(({p,b})=>`<div class="bar-row"><span class="n">${esc(p.name)}</span><span class="v"><b>${fmtNum(b.pct,0)} %</b></span><div class="bar"><i class="${b.lvl}" style="width:${Math.min(100,b.pct).toFixed(1)}%"></i></div><small style="grid-column:1/-1">${b.txt}</small></div>`).join('')}</div>`:'<p class="muted" style="margin-top:8px">Kein laufendes Projekt hat ein Budget. Das kannst du beim Projekt hinterlegen.</p>'}</section>
    </div>
  </div></div>`}

/* ---- Projekte / Kunden / Tätigkeiten ---- */

  if(ui.stammTab==='projekte'){const order={offen:0,pausiert:1,abgeschlossen:2};const ps=[...D.projects].sort((a,b)=>(order[a.status]??3)-(order[b.status]??3)||a.name.localeCompare(b.name));
    body=`<div class="sec-head"><h2>Baustellen & Projekte</h2><button class="btn primary small" data-act="new-project">${Is('plus')} Neu</button></div>
    ${ps.length?`<div class="list" style="margin-top:8px">${ps.map(p=>{const s=sumUp(D.entries.filter(e=>e.projectId===p.id));const b=budgetInfo(p);return`<div class="item" data-act="edit-project" data-id="${p.id}" role="button" tabindex="0"><div class="item-main"><b>${esc(p.name)}</b><small>${esc(custName(p))} · ${fmtHM(s.worked)} Std. · ${fmtEUR(s.total)}</small>${b?`<div class="bar" style="margin-top:4px"><i class="${b.lvl}" style="width:${Math.min(100,b.pct)}%"></i></div>`:''}</div><span class="pill p-${p.status}">${p.status}</span>${p.customerId?`<button class="btn small" data-act="report-setup" data-id="${p.id}" aria-label="Regiebericht">${Is('doc')}<span>Bericht</span></button>`:''}</div>`}).join('')}</div>`:`<p class="muted" style="margin-top:8px">Noch keine Projekte.</p>`}`}
  else if(ui.stammTab==='kunden'){body=`<div class="sec-head"><h2>Kunden</h2><button class="btn primary small" data-act="new-customer">${Is('plus')} Neu</button></div>
    ${D.customers.length?`<div class="list" style="margin-top:8px">${[...D.customers].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<div class="item" data-act="edit-customer" data-id="${c.id}" role="button" tabindex="0"><div class="item-main"><b>${esc(c.name)}</b><small>${esc([c.street,[c.zip,c.city].filter(Boolean).join(' ')].filter(Boolean).join(', '))||'Keine Adresse hinterlegt'}</small></div><span class="tn muted">${c.rate!=null?fmtEUR(c.rate)+'/Std.':''}</span></div>`).join('')}</div>`:`<p class="muted" style="margin-top:8px">Noch keine Kunden. Kunden legst du auch direkt beim Projekt an.</p>`}`}
  else body=`<div class="sec-head"><h2>Tätigkeiten</h2><button class="btn primary small" data-act="new-activity">${Is('plus')} Neu</button></div>
    <p class="muted" style="margin-top:6px">Interne Tätigkeiten zählen als Arbeitszeit, werden aber nicht berechnet.</p>
    <div class="list" style="margin-top:8px">${D.activities.map(a=>`<div class="item" data-act="edit-activity" data-id="${a.id}" role="button" tabindex="0"><div class="item-main"><b>${esc(a.name)}</b><small>${a.billable?'wird berechnet':'intern, nicht berechnet'}</small></div><span class="tn muted">${a.rate!=null?fmtEUR(a.rate)+'/Std.':''}</span></div>`).join('')}</div>`;
  return`<div class="stack">${storageBanner()}<div class="seg" role="group" aria-label="Bereich">${tabs.map(([k,l])=>`<button data-act="stamm-tab" data-t="${k}" aria-pressed="${ui.stammTab===k}">${l}</button>`).join('')}</div><section class="card">${body}</section></div>`}

/* ---- Einstellungen ---- */
function sf(key,label,val,o={}){const id='s-'+key;return`<div class="field" ${o.span?'style="grid-column:1/-1"':''}><label for="${id}">${label}</label><input id="${id}" data-set="${key}" ${o.num?'inputmode="decimal" data-num="1"':''} value="${esc(o.num?fmtNum(val,o.dec??2):val)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''}>${o.hint?`<small>${o.hint}</small>`:''}</div>`}
function companyFields(){const S=D.settings;return`<div class="grid2">${sf('name','Firmenname',S.name,{span:1})}${sf('owner','Inhaber',S.owner)}${sf('phone','Telefon',S.phone)}${sf('street','Straße, Nr.',S.street,{span:1})}${sf('zip','PLZ',S.zip)}${sf('city','Ort',S.city)}${sf('email','E-Mail',S.email)}${sf('taxId','Steuernummer',S.taxId)}${sf('bank','Bankverbindung (IBAN)',S.bank,{span:1})}</div>
  <div class="field"><span class="lbl">Firmenlogo</span><div class="row">${D.logo.data?`<img class="logo-prev" src="${D.logo.data}" alt="Firmenlogo">`:''}<label class="btn small">${Is('up')} ${D.logo.data?'Logo ersetzen':'Logo hochladen'}<input type="file" accept="image/*" data-change="logo" hidden></label>${D.logo.data?`<button class="btn small danger" data-act="logo-del">Entfernen</button>`:''}</div></div>`}
function vMehr(){const S=D.settings;
  return`<div class="cols two"><div class="stack">${storageBanner()}${cloudCard()}
    <section class="card stack"><h2>Datensicherung & Export</h2>

let sheetCleanup=null;
function openSheet(title,html,onMount){const w=$('#sheet');w.innerHTML=`<div class="sheet-backdrop" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-act="sheet-close" aria-label="Schließen">${I('x')}</button></div><div class="sheet-body">${html}</div></div>`;w.hidden=false;document.body.classList.add('noscroll');onMount&&onMount(w)}
function closeSheet(){if(sheetCleanup){const f=sheetCleanup;sheetCleanup=null;f()}const w=$('#sheet');w.hidden=true;w.innerHTML='';if($('#report').hidden)document.body.classList.remove('noscroll')}
function confirmBox(msg,ok='OK',danger=false){return new Promise(res=>{const el=$('#confirm');el.innerHTML=`<div class="sheet-backdrop" data-c="0"></div><div class="dialog" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><div class="sheet-actions"><button class="btn" data-c="0">Abbrechen</button><button class="btn ${danger?'danger':'primary'}" data-c="1">${esc(ok)}</button></div></div>`;el.hidden=false;
  el.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;e.stopPropagation();el.hidden=true;el.innerHTML='';el.onclick=null;res(b.dataset.c==='1')};el.querySelector('[data-c="1"]').focus()})}
let toastT;function toast(msg,kind='',action){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${action?`<button class="toast-btn" type="button">${esc(action.label)}</button>`:''}`;
  if(action)t.querySelector('button').onclick=()=>{t.className='toast';action.fn()};t.style.pointerEvents=action?'auto':'none';t.className='toast show '+kind;clearTimeout(toastT);toastT=setTimeout(()=>{t.className='toast';t.style.pointerEvents='none'},action||kind==='bad'?6000:2600)}

function projectOptions(sel){const groups={};for(const p of D.projects){if(p.status==='abgeschlossen'&&p.id!==sel)continue;const k=custName(p);(groups[k]=groups[k]||[]).push(p)}
  return`<option value="">Projekt wählen…</option>`+Object.keys(groups).sort().map(k=>`<optgroup label="${esc(k)}">${groups[k].map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup>`).join('')}
const activityOptions=sel=>D.activities.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
function matIndex(){const m={};for(const e of [...D.entries].sort((a,b)=>a.createdAt-b.createdAt))for(const x of e.materials||[])if(x.name)m[x.name]={unit:x.unit,price:x.price};return m}
const matRow=m=>`<div class="mat"><input data-m="name" list="dl-mats" placeholder="Material, z. B. Mörtel 25 kg" value="${esc(m.name||'')}" aria-label="Material"><input data-m="qty" inputmode="decimal" placeholder="Menge" value="${m.qty?String(m.qty).replace('.',','):''}" aria-label="Menge"><input data-m="unit" placeholder="Stk" value="${esc(m.unit||'')}" aria-label="Einheit"><input data-m="price" inputmode="decimal" placeholder="€/Stk" value="${m.price?fmtNum(m.price):''}" aria-label="Einzelpreis netto"><button type="button" class="icon-btn" data-x="del-mat" aria-label="Material entfernen">${I('x')}</button></div>`;
function openEntryEditor(id,preset={}){

  const ed=orig?clone(orig):newEntry({projectId:proj(ui.selProject)?ui.selProject:P.lastProject,activityId:act(ui.selActivity)?ui.selActivity:(P.lastActivity||D.activities[0]?.id),...preset});

  openSheet(orig?'Eintrag bearbeiten':'Zeit nachtragen',`<form class="form" id="ef" autocomplete="off" novalidate>

    <div class="seg" role="group" aria-label="Zeitangabe" style="align-self:flex-start"><button type="button" data-x="mode" data-m="range" aria-pressed="${ed.timeMode!=='dur'}">Von – bis</button><button type="button" data-x="mode" data-m="dur" aria-pressed="${ed.timeMode==='dur'}">Nur Stunden</button></div>
    <div class="grid3" id="ef-range" ${ed.timeMode==='dur'?'hidden':''}><div class="field"><label for="ef-start">Von</label><input type="time" id="ef-start" value="${ed.start}"></div><div class="field"><label for="ef-end">Bis</label><input type="time" id="ef-end" value="${ed.end}"></div><div class="field"><label for="ef-pause">Pause (Min.)</label><input id="ef-pause" inputmode="numeric" value="${ed.pause||''}" placeholder="0"></div></div>
    <div class="field" id="ef-durf" ${ed.timeMode==='dur'?'':'hidden'}><label for="ef-dur">Stunden</label><input id="ef-dur" inputmode="decimal" value="${ed.timeMode==='dur'&&ed.minutes?fmtHM(ed.minutes):''}" placeholder="z. B. 2:30 oder 2,5"></div>
    <div class="field"><label for="ef-note">Was wurde gemacht? <small>(erscheint auf dem Regiebericht)</small></label><textarea id="ef-note" rows="2">${esc(ed.note)}</textarea></div>
    <details class="more" ${hasExtra?'open':''}><summary>${Is('car')} Anfahrt und Material <small class="muted" id="ef-x1"></small></summary><div class="more-body">
      <div class="grid2"><div class="field"><label for="ef-km">Kilometer (hin und zurück)</label><input id="ef-km" inputmode="decimal" value="${ed.km?String(ed.km).replace('.',','):''}" placeholder="0"><small>${fmtEUR(D.settings.kmRate)} pro km</small></div><div class="field"><label for="ef-flat">oder Pauschale (€)</label><input id="ef-flat" inputmode="decimal" value="${ed.travelFlat?fmtNum(ed.travelFlat):''}" placeholder="0,00"></div></div>

      <label class="check"><input type="checkbox" id="ef-billable" ${ed.billable?'checked':''}> Dem Kunden berechnen</label>
      <div class="grid2"><div class="field"><label for="ef-status">Status</label><select id="ef-status">${['offen','berechnet','bezahlt'].map(s=>`<option ${ed.status===s?'selected':''}>${s}</option>`).join('')}</select></div>

    </div></details>
    <div class="ef-sum" id="ef-sum"></div>

    <datalist id="dl-workers">${workers.map(w=>`<option value="${esc(w)}">`).join('')}</datalist><datalist id="dl-mats">${Object.keys(mi).map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  </form>`,w=>{
    const f=$('#ef',w);
    const read=()=>{ed.projectId=$('#ef-project',w).value||null;ed.activityId=$('#ef-activity',w).value;ed.date=$('#ef-date',w).value||todayISO();ed.worker=$('#ef-worker',w).value.trim();
      if(ed.timeMode==='dur'){const m=parseDuration($('#ef-dur',w).value);ed.minutes=isFinite(m)?Math.max(0,Math.round(m)):0;ed.start='';ed.end='';ed.pause=0}
      else{ed.start=$('#ef-start',w).value;ed.end=$('#ef-end',w).value;ed.pause=Math.max(0,Math.round(num($('#ef-pause',w).value)));ed.minutes=ed.start&&ed.end?entryMinutes(ed.start,ed.end,ed.pause):0}
      ed.billable=$('#ef-billable',w).checked;const bo=parseDuration($('#ef-bill',w).value);ed.billOverride=isFinite(bo)?Math.max(0,Math.round(bo)):null;
      ed.status=$('#ef-status',w).value;ed.km=num($('#ef-km',w).value);ed.travelFlat=num($('#ef-flat',w).value);ed.note=$('#ef-note',w).value.trim();
      ed.materials=$$('.mat',w).map(r=>({name:$('[data-m=name]',r).value.trim(),qty:num($('[data-m=qty]',r).value),unit:$('[data-m=unit]',r).value.trim(),price:num($('[data-m=price]',r).value)})).filter(m=>m.name||m.qty||m.price)};
    const summary=()=>{read();const k=calc(ed);const rounded=ed.billable&&ed.billOverride==null&&k.billMin!==Math.round(k.worked);
      $('#ef-x1',w).textContent=[ed.km?fmtNum(ed.km,0)+' km':'',ed.travelFlat?'Pauschale':'',ed.materials.length?ed.materials.length+'× Material':''].filter(Boolean).join(' · ');

    summary();

      if(t.dataset.m==='name'&&mi[t.value]){const r=t.closest('.mat');if(!$('[data-m=unit]',r).value)$('[data-m=unit]',r).value=mi[t.value].unit||'';if(!$('[data-m=price]',r).value&&mi[t.value].price)$('[data-m=price]',r).value=fmtNum(mi[t.value].price)}
      summary()});
    f.addEventListener('click',async e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x;
      if(x==='mode'){ed.timeMode=b.dataset.m;$$('[data-x=mode]',w).forEach(y=>y.setAttribute('aria-pressed',y===b));$('#ef-range',w).hidden=ed.timeMode==='dur';$('#ef-durf',w).hidden=ed.timeMode!=='dur';if(ed.timeMode==='dur'&&ed.minutes)$('#ef-dur',w).value=fmtHM(ed.minutes);summary()}
      if(x==='add-mat'){$('#ef-mats',w).insertAdjacentHTML('beforeend',matRow({}));$('#ef-mats .mat:last-child [data-m=name]',w).focus()}

  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});

function shrinkCanvas(src,maxW){let w=Math.min(maxW,src.width),q=.8;for(;;){const h=Math.round(src.height*w/src.width),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(src,0,0,w,h);
  let d=c.toDataURL('image/png');if(d.length>40000)d=c.toDataURL('image/jpeg',q);if(d.length<=40000||w<160)return d;w=Math.round(w*.75);q=Math.max(.5,q-.1)}}

const TABLES=[
