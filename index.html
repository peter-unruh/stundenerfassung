/* Stil_PU mit Logo-Farben: Sandstein-Grund, Logo-Blau als einzige Signalfarbe, Orange nur als Markenstreifen. */
:root{
  --bg:#F2EDE3; --surface:#FBFAF7; --field:#FDFCFB; --surface-2:#F5F1E9;
  --text:#1B2340; --muted:#6E7183; --line:#E4E1DB; --border-c:#CFC9C0; --field-border:#B3AEA5;
  --accent:#1F4FB4; --on-accent:#FFFFFF; --accent-ink:#1F4FB4; --accent-bg:#E3EAF6;
  --brand:#F7A21B;
  --ok:#177A6B; --ok-bg:#D7ECE7; --warn:#A35A00; --warn-bg:#F3E3CC; --bad:#B42318; --bad-bg:#F0DAD6; --neutral:#A9A397;
  --radius:8px; --border:1px solid var(--border-c);
  --font-head:'Big Shoulders','Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --control-h:44px; --pad:16px; --gap:18px; --fs:15px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.45 var(--font-body)}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);font-weight:700;line-height:1.1;letter-spacing:.015em;text-transform:uppercase;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px}
p{margin:0}
a{color:var(--accent-ink)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.92em}
.lbl,.field>label{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
svg{flex-shrink:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Kopfzeile */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--surface)}
.kopf{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:3px solid var(--brand)}
.kopf-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:56px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marke{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;font-family:var(--font-head);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.marke img{width:34px;height:34px;border-radius:var(--radius);flex-shrink:0}
.hchip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:var(--border);background:var(--surface);border-radius:var(--radius);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0;color:var(--text)}
.mini-timer{font-variant-numeric:tabular-nums}
.sync-chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.sync-chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.sync-chip.busy svg{animation:blink 1.2s infinite}
@media (max-width:520px){.sync-chip.ok span,.sync-chip.busy span{display:none}.sync-chip{padding:0 9px}}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;animation:blink 1.6s infinite;flex-shrink:0}
.dot.p{background:var(--warn);animation:none}
@keyframes blink{50%{opacity:.3}}
.tabs{display:flex}
.tab{appearance:none;border:0;background:none;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:8px;font-weight:600;position:relative;min-width:0}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tab[aria-current="page"]{color:var(--accent-ink)}
@media (max-width:999px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:var(--border);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tab{flex-direction:column;justify-content:center;gap:3px;min-height:60px;font-size:clamp(11px,2.9vw,12px);padding:6px 2px}
  .tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--accent)}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
}
@media (min-width:1000px){
  .tabs{gap:2px;margin-left:8px}
  .tab{padding:0 12px;height:var(--control-h);border-radius:var(--radius)}
  .tab:hover{background:var(--surface-2)}
  .tab[aria-current="page"]{background:var(--accent-bg)}
}
main{max-width:1120px;margin:0 auto;padding-block:var(--gap) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Grundbausteine */
.stack{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.stack.eng{gap:10px}
.cols{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.cols.two{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}}
.schmal{max-width:560px;margin:0 auto}
.card{background:var(--surface);border:var(--border);border-radius:var(--radius);padding:var(--pad);min-width:0}
.kopfzeile{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--control-h);padding:0 var(--pad);border-radius:var(--radius);font-weight:600;font-size:15px;
  background:var(--accent);color:var(--on-accent);border:1.5px solid var(--accent);cursor:pointer;text-decoration:none;white-space:nowrap;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:box-shadow .08s,transform .08s}
.btn:hover{box-shadow:inset 0 -5px 0 rgba(0,0,0,.28)}
.btn:active{box-shadow:inset 0 2px 0 rgba(0,0,0,.25);transform:translateY(1px)}
.btn.sek{background:var(--surface);color:var(--text);border-color:var(--border-c);box-shadow:inset 0 -3px 0 rgba(27,35,64,.08)}
.btn.sek:hover{box-shadow:inset 0 -5px 0 rgba(27,35,64,.1)}
.btn.sek:active{box-shadow:inset 0 2px 0 rgba(27,35,64,.1)}
.btn.dunkel{background:var(--text);border-color:var(--text)}
.btn.gefahr{background:var(--surface);color:var(--bad);border-color:var(--bad);box-shadow:inset 0 -3px 0 rgba(180,35,24,.12)}
.btn.flach{background:transparent;border-color:transparent;color:var(--accent-ink);box-shadow:none;padding:0 10px}
.btn.flach:hover{background:var(--accent-bg)}
.btn.klein{height:38px;font-size:14px;padding:0 12px}
.btn.breit{width:100%}
.btn.gross{height:72px;font-size:22px;font-family:var(--font-head);letter-spacing:.06em;text-transform:uppercase;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{appearance:none;border:0;background:none;width:var(--control-h);height:var(--control-h);border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:var(--radius);white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.badge.offen{background:var(--warn-bg);color:var(--warn)}
.badge.bezahlt{background:var(--ok-bg);color:var(--ok)}
.badge.pausiert{background:var(--warn-bg);color:var(--warn)}
.badge.laufend{background:var(--ok-bg);color:var(--ok)}
.hinweis{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:var(--radius);background:var(--surface);border:var(--border)}
.hinweis b{display:block}
.hinweis>div{flex:1 1 220px;min-width:0}
.hinweis.info{background:var(--accent-bg);border-color:transparent}
.hinweis.warn{background:var(--warn-bg);border-color:transparent}
.hinweis.ok{background:var(--ok-bg);border-color:transparent}
.hinweis.bad{background:var(--bad-bg);border-color:transparent}
.trenner{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.trenner::before,.trenner::after{content:"";flex:1;height:1px;background:var(--line)}
details.mehr{border:var(--border);border-radius:var(--radius);background:var(--surface)}
details.mehr>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:0 14px;min-height:var(--control-h);font-weight:600}
details.mehr>summary::-webkit-details-marker{display:none}
details.mehr>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg)}
details.mehr[open]>summary::after{transform:rotate(-135deg)}
details.mehr>summary small{font-weight:400;color:var(--muted)}
.mehr-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.regel{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}

/* Erfassen */
.picks{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
@media (min-width:600px){.picks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 14px;min-height:56px;border:var(--border);background:var(--field);border-radius:var(--radius);cursor:pointer;min-width:0}
.pick:hover{border-color:var(--field-border)}
.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-bg)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--field-border);flex-shrink:0;position:relative;background:var(--field)}
.pick[aria-pressed="true"] .radio{border-color:var(--accent)}
.pick[aria-pressed="true"] .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.pick-t{display:flex;flex-direction:column;min-width:0}
.pick-t b,.pick-t small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-t small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;height:var(--control-h);padding:0 14px;border-radius:var(--radius);border:var(--border);background:var(--field);font-weight:600;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--field-border)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.neu{border-style:dashed;color:var(--muted);background:transparent}
.timer{border:2px solid var(--accent)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.uhr{font-family:var(--font-body);font-weight:600;font-variant-numeric:tabular-nums;font-size:clamp(52px,15vw,84px);line-height:1;letter-spacing:-.02em}
.timer.pause .uhr{color:var(--muted)}
.t-knoepfe{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.t-knoepfe .btn{height:60px;font-size:17px}
.warnzeile{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius);font-weight:600;font-size:14px}
.warnzeile.warn{background:var(--warn-bg);color:var(--warn)}
.warnzeile.bad{background:var(--bad-bg);color:var(--bad)}
.woche{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.wt{appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;border-radius:var(--radius);min-width:0;color:var(--text)}
.wt:hover{background:var(--surface-2)}
.wt-n{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.wt-bar{width:70%;max-width:26px;height:56px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.wt-bar i{display:block;width:100%;background:var(--text)}
.wt.heute .wt-bar i{background:var(--accent)}
.wt.heute .wt-n{color:var(--accent-ink)}
.wt-h{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);min-height:1.2em}

/* Listen */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:var(--border);border-radius:var(--radius);padding:3px;background:var(--surface);gap:2px;max-width:100%;overflow-x:auto}
.seg button{appearance:none;border:0;background:none;height:36px;padding:0 12px;border-radius:6px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.zeitraum{font-family:var(--font-head);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.015em;min-width:0}
.summen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:var(--border);border-radius:var(--radius);overflow:hidden}
.summen div{background:var(--surface);padding:10px 12px;min-width:0}
.summen b{display:block;font-size:clamp(17px,4.6vw,22px);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tag{background:var(--surface);border:var(--border);border-radius:var(--radius);overflow:hidden}
.tag-kopf{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tag-kopf h3{font-size:17px;white-space:nowrap}
.tag-kopf .num{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag.heute .tag-kopf h3{color:var(--accent-ink)}
.tag-leer{padding:12px 14px;color:var(--muted);font-size:14px}
.zeile{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 18px;border-top:1px solid var(--line);cursor:pointer;min-height:60px;box-shadow:inset 5px 0 0 var(--neutral)}
.tag-kopf+.zeile{border-top:0}
.zeile:hover{background:var(--surface-2)}
.zeile.offen{box-shadow:inset 5px 0 0 var(--warn)}
.zeile.bezahlt{box-shadow:inset 5px 0 0 var(--ok)}
.zeile.intern{box-shadow:inset 5px 0 0 var(--line)}
.z-zeit{font-variant-numeric:tabular-nums;font-size:13px;width:84px;flex-shrink:0;display:flex;flex-direction:column;color:var(--muted)}
.z-zeit b{font-size:16px;color:var(--text)}
.z-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.z-main b,.z-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.z-main span{color:var(--muted);font-size:14px}
.z-sum{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0;text-align:right}
@media (max-width:420px){.z-zeit{width:56px}.z-zeit span{display:none}.zeile{gap:10px;padding-right:12px}}

/* Auswertung */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:1000px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:var(--border);border-radius:var(--radius);padding:12px 14px;min-width:0}
.kpi .wert{font-size:clamp(20px,5vw,28px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.kpi small{display:block;margin-top:2px;color:var(--muted);text-align:right}
.kpi.haupt{border:2px solid var(--accent)}
.balken-liste{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.br{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.br .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.br .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px;text-align:right}
.balken{grid-column:1/-1;height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex}
.balken i{display:block;height:100%;background:var(--text)}
.balken i.ok{background:var(--ok)} .balken i.warn{background:var(--warn)} .balken i.bad{background:var(--bad)}
.stand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stand div{border-radius:var(--radius);padding:10px 12px;min-width:0}
.stand b{display:block;font-size:clamp(14px,3.8vw,18px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-offen{background:var(--warn-bg);color:var(--warn)} .st-berechnet{background:var(--surface-2);color:var(--text)} .st-bezahlt{background:var(--ok-bg);color:var(--ok)}

.liste{display:flex;flex-direction:column}
.eintrag{display:flex;gap:12px;align-items:center;padding:12px 8px 12px 16px;border-top:1px solid var(--line);cursor:pointer;min-width:0;box-shadow:inset 5px 0 0 var(--neutral)}
.eintrag:first-child{border-top:0}
.eintrag:hover{background:var(--surface-2)}
.eintrag.laufend{box-shadow:inset 5px 0 0 var(--ok)}
.eintrag.pausiert{box-shadow:inset 5px 0 0 var(--warn)}
.eintrag.plain{box-shadow:none;padding-left:8px}
.e-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.e-main b,.e-main small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-main small{color:var(--muted);font-size:13px}
@media (max-width:480px){.eintrag .btn.klein span{display:none}.eintrag .btn.klein{padding:0 10px}}

/* Formulare */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field small{font-size:13px;color:var(--muted)}
input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;min-width:0;height:var(--control-h);padding:0 12px;font-size:max(16px,var(--fs));background:var(--field);border:1.5px solid var(--field-border);border-radius:var(--radius);color:var(--text)}
textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid2>.btn{white-space:normal;text-align:center;line-height:1.2}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;min-height:var(--control-h);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);border-radius:4px;flex-shrink:0}
.mat{display:grid;grid-template-columns:minmax(0,1fr) 72px 64px 92px 44px;gap:6px;align-items:center}
@media (max-width:560px){.mat{grid-template-columns:repeat(3,minmax(0,1fr)) 44px}.mat [data-m=name]{grid-column:1/-1}}
.mats{display:flex;flex-direction:column;gap:8px}
.ef-sum{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;font-variant-numeric:tabular-nums}
.ef-sum .tot{margin-left:auto;font-size:22px;font-weight:600}
.logo-prev{max-height:56px;max-width:200px;object-fit:contain;background:#fff;border-radius:var(--radius);padding:6px;border:var(--border)}

/* Ebenen */
.layer{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#confirm{z-index:80;align-items:center}
.backdrop{position:absolute;inset:0;background:rgba(27,35,64,.45)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:640px;max-height:94vh;max-height:94dvh;border-radius:var(--radius) var(--radius) 0 0;border:var(--border);display:flex;flex-direction:column}
.sheet-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line)}
.sheet-body{overflow:auto;overscroll-behavior:contain;padding-block:16px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-fuss{position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;background:var(--surface);border-top:1px solid var(--line);margin:4px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-fuss .btn:not(.gefahr):not(.sek){flex:1 1 200px}
.sheet-body>:last-child:not(.sheet-fuss){margin-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:800px){.layer{align-items:center}.sheet{border-radius:var(--radius);max-height:90vh}}
.dialog{position:relative;background:var(--surface);border:var(--border);border-radius:var(--radius);padding:var(--pad);max-width:440px;width:calc(100% - 32px);display:flex;flex-direction:column;gap:16px}
.dialog-knoepfe{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.dialog-knoepfe.senkrecht{flex-direction:column;align-items:stretch}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:var(--text);color:#fff;padding:8px 8px 8px 14px;border-radius:var(--radius);font-weight:600;width:max-content;max-width:calc(100% - 32px);transition:.2s;display:flex;align-items:center;gap:12px;min-height:var(--control-h)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.toast-btn{appearance:none;border:0;background:#fff;color:var(--text);font-weight:600;border-radius:6px;height:34px;padding:0 12px;cursor:pointer;flex-shrink:0}
@media (min-width:1000px){.toast{bottom:24px}}
.fuss-links{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* Unterschrift */
.sigpad{position:relative;border:2px dashed var(--field-border);border-radius:var(--radius);background:#fff;height:200px;touch-action:none}
.sigpad canvas{width:100%;height:100%;display:block;border-radius:6px;touch-action:none}
.sigpad span{position:absolute;left:18px;right:18px;bottom:40px;border-top:1.5px solid #9aa3a0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7a8380;padding-top:4px;pointer-events:none}

/* Leistungsnachweis */
.bericht{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}
.b-bar{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:3px solid var(--brand);padding-top:env(safe-area-inset-top,0px)}
.b-bar-in{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.papier-wrap{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;align-items:center}
.papier-wrap>.hinweis{width:100%;max-width:210mm}
.papier{background:#fff;color:#111;width:100%;max-width:210mm;padding:clamp(18px,5vw,16mm);border:1px solid var(--border-c);font:10.5pt/1.4 var(--font-body);border-radius:2px}
.papier h1{font-size:20pt}
.papier h2{font-size:12pt;margin:18px 0 6px;color:#333}
.p-kopf{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-start;padding-bottom:10px;border-bottom:2px solid #111}
.p-logo{max-height:60px;max-width:200px;object-fit:contain}
.p-firma{font-size:9pt;color:#444}
.p-firma b{color:#111;font-size:11pt}
.p-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 24px;margin-top:16px}
.p-meta .k{font-size:7.5pt;text-transform:uppercase;letter-spacing:.12em;color:#666;font-weight:600}
.p-tw{overflow-x:auto}
.p-t{width:100%;min-width:520px;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:9.5pt}
.p-t th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.1em;color:#555;border-bottom:1.5px solid #111;padding:5px 6px;font-weight:600}
.p-t td{border-bottom:1px solid #ddd;padding:6px;vertical-align:top}
.p-t .r{text-align:right;white-space:nowrap}
.p-t tfoot td{border-bottom:0;font-weight:700}
.p-sum{margin-left:auto;margin-top:14px;width:min(100%,300px);border-collapse:collapse;font-variant-numeric:tabular-nums}
.p-sum td{padding:4px 6px}
.p-sum td:last-child{text-align:right;white-space:nowrap}
.p-sum tr.g td{border-top:2px solid #111;font-weight:700;font-size:12pt;padding-top:8px}
.p-note{font-size:8.5pt;color:#444;margin-top:6px}
.p-sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}
.p-sign .sl{border-top:1.5px solid #111;padding-top:4px;font-size:8.5pt;color:#444;min-height:20px}
.p-sign .sa{height:70px;display:flex;align-items:flex-end}
.p-sign img{max-height:70px;max-width:100%}
.p-fuss{margin-top:24px;padding-top:8px;border-top:1px solid #ddd;font-size:8pt;color:#666;display:flex;gap:4px 14px;flex-wrap:wrap}
@media (max-width:560px){.p-sign{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  body::before,.kopf,main,#sheet,#confirm,#toast,.b-bar,.papier-wrap>.hinweis{display:none!important}
  .bericht{position:static!important;overflow:visible!important;background:#fff!important}
  .papier-wrap{padding:0!important;display:block}
  .papier{border:0!important;max-width:none!important;padding:0!important}
  .p-tw{overflow:visible}.p-t{min-width:0}
  tr,.p-sign{break-inside:avoid}
}
</style>
</head>

const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoDate(d)};

const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
function parseNum(v){if(typeof v==='number')return v;if(v==null)return NaN;let s=String(v).trim().replace(/\s|€/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)}

const r2=n=>Math.round((n||0)*100)/100;
const fmtNum=(n,dec=2)=>(n||0).toLocaleString('de-DE',{minimumFractionDigits:dec,maximumFractionDigits:dec});

const fmtStd=min=>r2((min||0)/60).toLocaleString('de-DE',{maximumFractionDigits:2})+' h';

const fmtTagLang=iso=>new Date(iso+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long'})+', '+fmtDate(iso);

const fmtClock=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
function parseDuration(s){s=String(s||'').trim().toLowerCase();if(!s)return NaN;if(s.includes(':')){const [h,m]=s.split(':');return num(h)*60+num(m)}if(/m(in)?$/.test(s))return num(s.replace(/[^\d,.]/g,''),NaN);return Math.round(num(s.replace(/\s*h$/,''),NaN)*60)}
function isoWeek(iso){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4,12);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)}

function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const appUrl=()=>location.origin+location.pathname.replace(/[^/]*$/,'');

const svg=(p,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

/* =================== Speicher =================== */
let canStore=true;try{localStorage.setItem('__sw','1');localStorage.removeItem('__sw')}catch(e){canStore=false}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const STANDARD_TAETIGKEITEN=[['a-arbeit','Arbeit vor Ort',true],['a-anfahrt','Anfahrt',true],['a-beratung','Beratung / Besichtigung',true],['a-nacharbeit','Nacharbeit',true],['a-buero','Büro (intern)',false]];
function defaults(){return{version:2,sample:false,
  settings:{name:'',owner:'',street:'',zip:'',city:'',phone:'',email:'',taxId:'',bank:'',defaultRate:50,kmRate:0.5,rounding:15,roundMode:'up',vat:19,kleinunternehmer:false,reportSeq:1,updatedAt:0},

const saveP=()=>ls.set(PK,JSON.stringify(P));

function upsert(coll,rec){rec.updatedAt=Date.now();const a=D[coll],i=a.findIndex(x=>x.id===rec.id);if(i<0)a.push(rec);else a[i]=rec;return rec}

/* =================== Rechenlogik =================== */

function satzInfo(e){const p=proj(e.projectId),c=p&&cust(p.customerId),a=act(e.activityId);
  if(e.rate!=null)return{satz:e.rate,quelle:'Eintrag'};if(p?.rate!=null)return{satz:p.rate,quelle:'Auftrag'};if(c?.rate!=null)return{satz:c.rate,quelle:'Kunde'};if(a?.rate!=null)return{satz:a.rate,quelle:'Tätigkeit'};return{satz:D.settings.defaultRate,quelle:'Standard'}}
const rateFor=e=>satzInfo(e).satz;
const satzText=e=>{const s=satzInfo(e);return`${fmtEUR(s.satz)}/h (${s.quelle})`};
function roundMin(m){const s=+D.settings.rounding;if(m<=0)return 0;if(!s)return Math.round(m);return D.settings.roundMode==='nearest'?Math.max(s,Math.round(m/s)*s):Math.ceil(m/s-1e-9)*s}
function defaultBillable(projectId,activityId){const a=act(activityId),p=proj(projectId);return(a?a.billable:true)&&!!(p&&p.customerId)}
function calc(e){const worked=e.minutes||0;const billMin=e.billable?(e.billOverride!=null?e.billOverride:roundMin(worked)):0;const rate=rateFor(e);const labor=billMin/60*rate;
  const travel=num(e.km)*D.settings.kmRate+num(e.travelFlat);const mat=(e.materials||[]).reduce((s,m)=>s+num(m.qty)*num(m.price),0);
  return{worked,billMin,rate,labor,travel,mat,total:labor+travel+mat}}
function sumUp(list){const r={worked:0,billMin:0,billWorked:0,labor:0,travel:0,mat:0,total:0};for(const e of list){const k=calc(e);r.worked+=k.worked;r.billMin+=k.billMin;if(e.billable)r.billWorked+=k.worked;r.labor+=k.labor;r.travel+=k.travel;r.mat+=k.mat;r.total+=k.total}return r}
function budgetInfo(p){if(!p||!p.budgetType||p.budgetType==='none'||!(p.budget>0))return null;const s=sumUp(D.entries.filter(e=>e.projectId===p.id));
  const used=p.budgetType==='h'?s.billMin/60:s.total;const pct=used/p.budget*100;const lvl=pct>=100?'bad':pct>=80?'warn':'ok';
  const txt=p.budgetType==='h'?`${fmtNum(used,1)} von ${fmtNum(p.budget,0)} h`:`${fmtEUR(used)} von ${fmtEUR(p.budget)}`;return{pct,lvl,txt}}
function budgetWarn(p){const b=budgetInfo(p);if(!b||b.lvl==='ok')return'';return`<div class="warnzeile ${b.lvl}">${Is('warn')}<span>Budget ${fmtNum(b.pct,0)} % · ${b.txt}</span></div>`}
const matText=e=>(e.materials||[]).map(m=>`${String(m.qty).replace('.',',')} ${m.unit||''} ${m.name}`.replace(/\s+/g,' ').trim()).join('; ');
function newEntry(o={}){const e={id:uid(),createdAt:Date.now(),date:todayISO(),start:'',end:'',pause:0,minutes:0,timeMode:'range',projectId:null,activityId:null,note:'',worker:P.worker||'',billable:true,billOverride:null,rate:null,km:0,travelFlat:0,materials:[],status:'offen',...o};

function startTimer(projectId,activityId){P.timer={projectId,activityId,startTs:Date.now(),pauses:[],note:''};P.lastProject=projectId;P.lastActivity=activityId;saveP()}

  const pm=Math.round(pauseMs(t,now)/60000),start=hhmm(t.startTs),end=hhmm(now);let o={date:isoDate(new Date(t.startTs)),start,end,pause:pm,timeMode:'range',minutes:entryMinutes(start,end,pm)};
  if(now-t.startTs>=864e5||o.minutes<1)o={...o,start:'',end:'',pause:0,timeMode:'dur',minutes:Math.max(1,Math.round(timerMs(t,now)/60000))};
  const e=newEntry({...o,projectId:t.projectId,activityId:t.activityId,note:t.note||''});upsert('entries',e);P.timer=null;saveP();commit();return e}

const VIEWS=[['erfassen','Erfassen','clock'],['eintraege','Einträge','list'],['auswertung','Auswertung','chart'],['stamm','Aufträge','folder'],['mehr','Betrieb','betrieb']];

function recentProjects(){const last={};for(const e of D.entries)last[e.projectId]=Math.max(last[e.projectId]||0,e.createdAt||0);

function weekCard(){const s0=weekStart(todayISO());const days=[...Array(7)].map((_,i)=>addDays(s0,i));const mins=days.map(d=>sumUp(D.entries.filter(e=>e.date===d)).worked);const max=Math.max(480,...mins);const tot=mins.reduce((a,b)=>a+b,0);

function vAuswertung(){const[a,b]=periodBounds(ui.period);const list=D.entries.filter(e=>e.date>=a&&e.date<=b);const s=sumUp(list);const ratio=s.worked?s.billWorked/s.worked*100:0;

/* ---- Aufträge / Kunden / Tätigkeiten ---- */
function vStamm(){const tabs=[['projekte','Aufträge'],['kunden','Kunden'],['taetigkeiten','Tätigkeiten']];let body='';
  if(ui.stammTab==='projekte'){const order={offen:0,pausiert:1,abgeschlossen:2};const ps=[...D.projects].sort((a,b)=>(order[a.status]??3)-(order[b.status]??3)||a.name.localeCompare(b.name));
    body=`<div class="kopfzeile"><h2>Aufträge</h2><button class="btn klein" data-act="new-project">${Is('plus')} Auftrag anlegen</button></div>
    ${ps.length?`<div class="liste" style="margin-top:10px">${ps.map(p=>{const s=sumUp(D.entries.filter(e=>e.projectId===p.id));const b=budgetInfo(p);return`<div class="eintrag ${p.status==='offen'?'laufend':p.status==='pausiert'?'pausiert':''}" data-act="edit-project" data-id="${p.id}" role="button" tabindex="0"><div class="e-main"><b>${esc(p.name)}</b><small class="num">${esc(custName(p))} · ${fmtStd(s.worked)} · ${fmtEUR(s.total)}${p.rate!=null?' · '+fmtEUR(p.rate)+'/h':''}</small>${b?`<div class="balken" style="margin-top:4px"><i class="${b.lvl}" style="width:${Math.min(100,b.pct)}%"></i></div>`:''}</div><span class="badge ${p.status==='offen'?'laufend':p.status}">${p.status==='offen'?'läuft':p.status}</span>${p.customerId?`<button class="btn sek klein" data-act="report-setup" data-id="${p.id}" aria-label="Leistungsnachweis">${Is('down')}<span>Nachweis</span></button>`:''}</div>`}).join('')}</div>`:`<p class="muted" style="margin-top:8px">Noch keine Aufträge.</p>`}`}
  else if(ui.stammTab==='kunden'){body=`<div class="kopfzeile"><h2>Kunden</h2><button class="btn klein" data-act="new-customer">${Is('plus')} Kunde anlegen</button></div>
    ${D.customers.length?`<div class="liste" style="margin-top:10px">${[...D.customers].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<div class="eintrag plain" data-act="edit-customer" data-id="${c.id}" role="button" tabindex="0"><div class="e-main"><b>${esc(c.name)}</b><small>${esc([c.street,[c.zip,c.city].filter(Boolean).join(' ')].filter(Boolean).join(', '))||'Keine Adresse'}</small></div><span class="num muted">${c.rate!=null?fmtEUR(c.rate)+'/h':''}</span></div>`).join('')}</div>`:`<p class="muted" style="margin-top:8px">Noch keine Kunden. Kunden auch direkt beim Auftrag anlegen.</p>`}`}
  else body=`<div class="kopfzeile"><h2>Tätigkeiten</h2><button class="btn klein" data-act="new-activity">${Is('plus')} Tätigkeit anlegen</button></div>
    <p class="muted" style="margin-top:6px">Interne Tätigkeiten zählen als Arbeitszeit, werden aber nicht berechnet.</p>
    <div class="liste" style="margin-top:10px">${D.activities.map(a=>`<div class="eintrag plain" data-act="edit-activity" data-id="${a.id}" role="button" tabindex="0"><div class="e-main"><b>${esc(a.name)}</b><small>${a.billable?'wird berechnet':'intern'}</small></div><span class="num muted">${a.rate!=null?fmtEUR(a.rate)+'/h':''}</span></div>`).join('')}</div>`;
  return`<div class="stack">${storageBanner()}<div class="seg" role="group" aria-label="Bereich">${tabs.map(([k,l])=>`<button data-act="stamm-tab" data-t="${k}" aria-pressed="${ui.stammTab===k}">${l}</button>`).join('')}</div><section class="card">${body}</section></div>`}

/* ---- Betrieb (Einstellungen) ---- */
function sf(key,label,val,o={}){const id='s-'+key;return`<div class="field" ${o.span?'style="grid-column:1/-1"':''}><label for="${id}">${label}</label><input id="${id}" data-set="${key}" ${o.num?'inputmode="decimal" data-num="1"':''} value="${esc(o.num?fmtNum(val,o.dec??2):val)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''}>${o.hint?`<small>${o.hint}</small>`:''}</div>`}
function companyFields(){const S=D.settings;return`<div class="grid2">${sf('name','Firmenname',S.name,{span:1})}${sf('owner','Inhaber',S.owner)}${sf('phone','Telefon',S.phone)}${sf('street','Straße, Nr.',S.street,{span:1})}${sf('zip','PLZ',S.zip)}${sf('city','Ort',S.city)}${sf('email','E-Mail',S.email)}${sf('taxId','Steuernummer',S.taxId)}${sf('bank','IBAN',S.bank,{span:1})}</div>
  <div class="field"><span class="lbl">Logo für den Leistungsnachweis</span><div class="row">${D.logo.data?`<img class="logo-prev" src="${D.logo.data}" alt="Firmenlogo">`:''}<label class="btn sek klein">${Is('up')} ${D.logo.data?'Logo ersetzen':'Logo hochladen'}<input type="file" accept="image/*" data-change="logo" hidden></label>${D.logo.data?`<button class="btn gefahr klein" data-act="logo-del">Entfernen</button>`:''}</div></div>`}
function vMehr(){const S=D.settings;
  return`<div class="cols two"><div class="stack">${storageBanner()}${cloudCard()}
    <section class="card stack"><h2>Sicherung & Export</h2>
      <p class="muted">${cloudOn()?'Daten liegen in Google Drive. Zusätzliches Backup empfohlen.':`Daten nur in diesem Browser. Letztes Backup: <b class="num">${P.lastBackup?fmtDT(P.lastBackup):'nie'}</b>`}</p>
      <div class="grid2"><button class="btn sek" data-act="backup">${Is('down')} Backup speichern</button><button class="btn sek" data-act="import">${Is('up')} Backup laden</button></div>
      <button class="btn sek" data-act="csv-all">${Is('down')} Alle Zeiten als Excel-Datei (CSV)</button>
      <p class="muted" id="storage-info" style="font-size:13px"></p>
    </section>
    <section class="card stack"><h2>Rechtliches</h2>
      <p class="muted" style="font-size:14px">${esc(KONFIG.appName)} ist kostenlos und ohne Gewähr. Beträge vor der Rechnung prüfen. Für eingegebene Daten und das verbundene Google-Konto ist der Nutzer selbst verantwortlich.</p>
      <div class="fuss-links"><a href="info.html">Über ${esc(KONFIG.appName)}</a><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></div>
    </section>
  </div><div class="stack">
    <section class="card form"><h2>Abrechnung</h2>
      <div class="grid2">${sf('defaultRate','Standard-Stundensatz (€ netto)',S.defaultRate,{num:1})}${sf('kmRate','Kilometersatz (€/km)',S.kmRate,{num:1})}
      <div class="field"><label for="s-rounding">Berechnete Zeit runden</label><select id="s-rounding" data-set="rounding" data-int="1">${[[0,'minutengenau'],[5,'5 Minuten'],[10,'10 Minuten'],[15,'15 Minuten'],[30,'30 Minuten']].map(([v,l])=>`<option value="${v}" ${+S.rounding===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label for="s-roundMode">Rundungsart</label><select id="s-roundMode" data-set="roundMode"><option value="up" ${S.roundMode==='up'?'selected':''}>aufrunden</option><option value="nearest" ${S.roundMode==='nearest'?'selected':''}>kaufmännisch</option></select></div>
      ${sf('vat','Umsatzsteuer (%)',S.vat,{num:1,dec:0})}<div class="field"><label for="p-worker">Mitarbeitername (dieses Gerät)</label><input id="p-worker" data-pref="worker" value="${esc(P.worker)}" placeholder="z. B. Jan"></div></div>
      <label class="check"><input type="checkbox" data-set="kleinunternehmer" ${S.kleinunternehmer?'checked':''}> Kleinunternehmer (§ 19 UStG), keine Umsatzsteuer</label>
      <details class="mehr"><summary>Welcher Stundensatz gilt?</summary><div class="mehr-body"><p>Der speziellste Satz gewinnt:</p><ol class="regel"><li>Satz direkt am Eintrag</li><li>Satz des Auftrags</li><li>Satz des Kunden</li><li>Satz der Tätigkeit</li><li>Standard-Stundensatz</li></ol><p class="muted">Beim Erfassen wird angezeigt, welcher Satz greift. Beispiel Rundung: 1 h 5 min bei „15 Minuten, aufrunden“ = 1,25 h berechnet.</p></div></details>
    </section>
    <section class="card form"><h2>Firmendaten</h2><p class="muted" style="font-size:14px">Erscheinen auf dem Leistungsnachweis.</p>${companyFields()}</section>
    <section class="card stack"><h2>Zurücksetzen</h2><p class="muted">Löscht alle Daten auf diesem Gerät.${cloudOn()?' Die Google-Tabelle bleibt erhalten.':''}</p><button class="btn gefahr" data-act="reset">Alle Daten auf diesem Gerät löschen</button></section>
    ${betreiberCard()}
  </div></div>`}
async function storageInfo(){const el=$('#storage-info');if(!el||!navigator.storage?.persisted)return;try{const p=await navigator.storage.persisted();el.textContent=p?'Browser löscht die Daten nicht automatisch.':'Browser darf Daten bei Speichermangel löschen.'}catch(e){}}

/* =================== Ebenen =================== */
let sheetCleanup=null;
function openSheet(title,html,onMount){const w=$('#sheet');w.innerHTML=`<div class="backdrop" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-kopf"><h3>${esc(title)}</h3><button class="icon-btn" data-act="sheet-close" aria-label="Schließen">${I('x')}</button></div><div class="sheet-body">${html}</div></div>`;w.hidden=false;document.body.classList.add('noscroll');onMount&&onMount(w)}
function closeSheet(){if(sheetCleanup){const f=sheetCleanup;sheetCleanup=null;f()}const w=$('#sheet');w.hidden=true;w.innerHTML='';if($('#report').hidden)document.body.classList.remove('noscroll')}
/* Auswahl-Dialog: Promise liefert den „wert“ der gewählten Option oder null */
function auswahlDialog(text,optionen,senkrecht=false){return new Promise(res=>{const el=$('#confirm');
  el.innerHTML=`<div class="backdrop" data-c=""></div><div class="dialog" role="alertdialog" aria-modal="true"><p>${esc(text)}</p><div class="dialog-knoepfe ${senkrecht?'senkrecht':''}">${optionen.map((o,i)=>`<button class="btn ${o.art||'sek'}" data-c="${i}">${esc(o.label)}</button>`).join('')}</div></div>`;el.hidden=false;
  el.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;e.stopPropagation();el.hidden=true;el.innerHTML='';el.onclick=null;res(b.dataset.c===''?null:optionen[+b.dataset.c].wert)};
  el.querySelector('.dialog [data-c]:last-child')?.focus()})}
const confirmBox=(msg,ok='OK',danger=false)=>auswahlDialog(msg,[{label:'Abbrechen',wert:false},{label:ok,wert:true,art:danger?'gefahr':''}]).then(v=>!!v);
let toastT;function toast(msg,kind='',action){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${action?`<button class="toast-btn" type="button">${esc(action.label)}</button>`:''}`;
  if(action)t.querySelector('button').onclick=()=>{t.className='toast';action.fn()};t.style.pointerEvents=action?'auto':'none';t.className='toast show '+kind;clearTimeout(toastT);toastT=setTimeout(()=>{t.className='toast';t.style.pointerEvents='none'},action||kind==='bad'?6500:2600)}

/* =================== Editor: Zeiteintrag =================== */
function projectOptions(sel){const groups={};for(const p of D.projects){if(p.status==='abgeschlossen'&&p.id!==sel)continue;const k=custName(p);(groups[k]=groups[k]||[]).push(p)}
  return`<option value="">Auftrag wählen …</option>`+Object.keys(groups).sort().map(k=>`<optgroup label="${esc(k)}">${groups[k].map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup>`).join('')}
const activityOptions=sel=>D.activities.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
function matIndex(){const m={};for(const e of [...D.entries].sort((a,b)=>a.createdAt-b.createdAt))for(const x of e.materials||[])if(x.name)m[x.name]={unit:x.unit,price:x.price};return m}
const matRow=m=>`<div class="mat"><input data-m="name" list="dl-mats" placeholder="Material" value="${esc(m.name||'')}" aria-label="Material"><input data-m="qty" inputmode="decimal" placeholder="Menge" value="${m.qty?String(m.qty).replace('.',','):''}" aria-label="Menge"><input data-m="unit" placeholder="Stk" value="${esc(m.unit||'')}" aria-label="Einheit"><input data-m="price" inputmode="decimal" placeholder="€/Einh." value="${m.price?fmtNum(m.price):''}" aria-label="Einzelpreis netto"><button type="button" class="icon-btn" data-x="del-mat" aria-label="Material entfernen">${I('x')}</button></div>`;
function openEntryEditor(id,preset={}){
  const orig=id?D.entries.find(e=>e.id===id):null;if(id&&!orig){toast('Eintrag existiert nicht mehr.','bad');return}
  const ed=orig?{rate:null,...clone(orig)}:newEntry({projectId:proj(ui.selProject)?ui.selProject:P.lastProject,activityId:act(ui.selActivity)?ui.selActivity:(P.lastActivity||D.activities[0]?.id),...preset});
  const workers=[...new Set(D.entries.map(e=>e.worker).concat(P.worker).filter(Boolean))],mi=matIndex();
  const hasExtra=ed.km||ed.travelFlat||ed.materials.length,hasBill=!ed.billable||ed.billOverride!=null||ed.rate!=null||ed.status!=='offen';
  openSheet(orig?'Eintrag bearbeiten':'Zeit nachtragen',`<form class="form" id="ef" autocomplete="off" novalidate>
    <div class="grid2"><div class="field"><label for="ef-project">Auftrag</label><select id="ef-project">${projectOptions(ed.projectId)}</select></div>
    <div class="field"><label for="ef-activity">Tätigkeit</label><select id="ef-activity">${activityOptions(ed.activityId)}</select></div></div>
    <div class="field"><label for="ef-date">Datum</label><input type="date" id="ef-date" value="${ed.date}"></div>
    <div class="seg" role="group" aria-label="Zeitangabe" style="align-self:flex-start"><button type="button" data-x="mode" data-m="range" aria-pressed="${ed.timeMode!=='dur'}">Von – bis</button><button type="button" data-x="mode" data-m="dur" aria-pressed="${ed.timeMode==='dur'}">Nur Stunden</button></div>
    <div class="grid3" id="ef-range" ${ed.timeMode==='dur'?'hidden':''}><div class="field"><label for="ef-start">Von</label><input type="time" id="ef-start" value="${ed.start}"></div><div class="field"><label for="ef-end">Bis</label><input type="time" id="ef-end" value="${ed.end}"></div><div class="field"><label for="ef-pause">Pause min</label><input id="ef-pause" inputmode="numeric" value="${ed.pause||''}" placeholder="0"></div></div>
    <div class="field" id="ef-durf" ${ed.timeMode==='dur'?'':'hidden'}><label for="ef-dur">Stunden</label><input id="ef-dur" inputmode="decimal" value="${ed.timeMode==='dur'?stdEingabe(ed.minutes):''}" placeholder="z. B. 2,5 oder 2:30"></div>
    <div class="field"><label for="ef-note">Ausgeführte Arbeiten</label><textarea id="ef-note" rows="2" placeholder="Erscheint auf dem Leistungsnachweis">${esc(ed.note)}</textarea></div>
    <details class="mehr" ${hasExtra?'open':''}><summary>Anfahrt und Material <small id="ef-x1"></small></summary><div class="mehr-body">
      <div class="grid2"><div class="field"><label for="ef-km">Kilometer</label><input id="ef-km" inputmode="decimal" value="${ed.km?String(ed.km).replace('.',','):''}" placeholder="0"><small>${fmtEUR(D.settings.kmRate)} pro km</small></div><div class="field"><label for="ef-flat">Pauschale €</label><input id="ef-flat" inputmode="decimal" value="${ed.travelFlat?fmtNum(ed.travelFlat):''}" placeholder="0,00"></div></div>
      <span class="lbl">Material</span><div class="mats" id="ef-mats">${ed.materials.map(matRow).join('')}</div><button type="button" class="btn sek klein" data-x="add-mat" style="align-self:flex-start">${Is('plus')} Material</button>
    </div></details>
    <details class="mehr" ${hasBill?'open':''}><summary>Satz, Status, Mitarbeiter <small id="ef-x2"></small></summary><div class="mehr-body">
      <label class="check"><input type="checkbox" id="ef-billable" ${ed.billable?'checked':''}> Dem Kunden berechnen</label>
      <div class="grid2"><div class="field"><label for="ef-rate">Stundensatz für diesen Eintrag €</label><input id="ef-rate" inputmode="decimal" value="${ed.rate!=null?fmtNum(ed.rate):''}"><small id="ef-rate-h"></small></div>
      <div class="field"><label for="ef-bill">Berechnete Stunden</label><input id="ef-bill" inputmode="decimal" value="${ed.billOverride!=null?stdEingabe(ed.billOverride):''}"><small>Leer = automatisch gerundet</small></div>
      <div class="field"><label for="ef-status">Status</label><select id="ef-status">${['offen','berechnet','bezahlt'].map(s=>`<option ${ed.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label for="ef-worker">Mitarbeiter</label><input id="ef-worker" list="dl-workers" value="${esc(ed.worker)}" placeholder="Name"></div></div>
    </div></details>
    <div class="ef-sum" id="ef-sum"></div>
    <div class="sheet-fuss">${orig?`<button type="button" class="btn gefahr" data-x="delete">Löschen</button>`:''}<button type="submit" class="btn">Speichern</button></div>
    <datalist id="dl-workers">${workers.map(w=>`<option value="${esc(w)}">`).join('')}</datalist><datalist id="dl-mats">${Object.keys(mi).map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  </form>`,w=>{
    const f=$('#ef',w);
    const read=()=>{ed.projectId=$('#ef-project',w).value||null;ed.activityId=$('#ef-activity',w).value;ed.date=$('#ef-date',w).value||todayISO();ed.worker=$('#ef-worker',w).value.trim();
      if(ed.timeMode==='dur'){const m=parseDuration($('#ef-dur',w).value);ed.minutes=isFinite(m)?Math.max(0,Math.round(m)):0;ed.start='';ed.end='';ed.pause=0}
      else{ed.start=$('#ef-start',w).value;ed.end=$('#ef-end',w).value;ed.pause=Math.max(0,Math.round(num($('#ef-pause',w).value)));ed.minutes=ed.start&&ed.end?entryMinutes(ed.start,ed.end,ed.pause):0}
      ed.billable=$('#ef-billable',w).checked;const bo=parseDuration($('#ef-bill',w).value);ed.billOverride=isFinite(bo)?Math.max(0,Math.round(bo)):null;
      const rt=parseNum($('#ef-rate',w).value);ed.rate=isFinite(rt)?rt:null;
      ed.status=$('#ef-status',w).value;ed.km=num($('#ef-km',w).value);ed.travelFlat=num($('#ef-flat',w).value);ed.note=$('#ef-note',w).value.trim();
      ed.materials=$$('.mat',w).map(r=>({name:$('[data-m=name]',r).value.trim(),qty:num($('[data-m=qty]',r).value),unit:$('[data-m=unit]',r).value.trim(),price:num($('[data-m=price]',r).value)})).filter(m=>m.name||m.qty||m.price)};
    const summary=()=>{read();const k=calc(ed);const rounded=ed.billable&&ed.billOverride==null&&k.billMin!==Math.round(k.worked);
      const ohne=satzInfo({...ed,rate:null});$('#ef-rate').placeholder=fmtNum(ohne.satz);$('#ef-rate-h',w).textContent=ed.rate!=null?'Eigener Satz für diesen Eintrag':`Leer = ${fmtEUR(ohne.satz)} vom ${ohne.quelle==='Standard'?'Standard':ohne.quelle==='Auftrag'?'Auftrag':ohne.quelle==='Kunde'?'Kunden':'Tätigkeitssatz'}`;
      $('#ef-x1',w).textContent=[ed.km?fmtNum(ed.km,0)+' km':'',ed.travelFlat?'Pauschale':'',ed.materials.length?ed.materials.length+'× Material':''].filter(Boolean).join(' · ');
      $('#ef-x2',w).textContent=ed.billable?satzText(ed):'intern';
      $('#ef-sum',w).innerHTML=`<span>Gearbeitet <b>${fmtStd(k.worked)}</b></span>${ed.billable?`<span>Berechnet <b>${fmtStd(k.billMin)}</b>${rounded?' (gerundet)':''} × ${fmtEUR(k.rate)}</span>`:'<span>wird nicht berechnet</span>'}<span class="tot">${fmtEUR(k.total)}</span>`};
    summary();
    f.addEventListener('input',summary);
    f.addEventListener('change',e=>{const t=e.target;
      if(t.id==='ef-project'||t.id==='ef-activity')$('#ef-billable',w).checked=defaultBillable($('#ef-project',w).value,$('#ef-activity',w).value);
      if(t.dataset.m==='name'&&mi[t.value]){const r=t.closest('.mat');if(!$('[data-m=unit]',r).value)$('[data-m=unit]',r).value=mi[t.value].unit||'';if(!$('[data-m=price]',r).value&&mi[t.value].price)$('[data-m=price]',r).value=fmtNum(mi[t.value].price)}
      summary()});
    f.addEventListener('click',async e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x;
      if(x==='mode'){ed.timeMode=b.dataset.m;$$('[data-x=mode]',w).forEach(y=>y.setAttribute('aria-pressed',y===b));$('#ef-range',w).hidden=ed.timeMode==='dur';$('#ef-durf',w).hidden=ed.timeMode!=='dur';if(ed.timeMode==='dur'&&ed.minutes)$('#ef-dur',w).value=stdEingabe(ed.minutes);summary()}
      if(x==='add-mat'){$('#ef-mats',w).insertAdjacentHTML('beforeend',matRow({}));$('#ef-mats .mat:last-child [data-m=name]',w).focus()}
      if(x==='del-mat'){b.closest('.mat').remove();summary()}
      if(x==='delete'&&await confirmBox('Eintrag löschen?','Löschen',true)){removeRec('entries',orig.id);commit();closeSheet();render();toast('Eintrag gelöscht')}});
    f.addEventListener('submit',e=>{e.preventDefault();read();
      if(!ed.projectId){toast('Auftrag wählen.','bad');$('#ef-project',w).focus();return}
      const onlyCosts=ed.materials.length||ed.km||ed.travelFlat;
      if(ed.timeMode!=='dur'&&(!ed.start||!ed.end)&&!onlyCosts){toast('Von und Bis eintragen oder „Nur Stunden“ wählen.','bad');return}
      if(!ed.minutes&&!onlyCosts){toast('Arbeitszeit ist 0. Zeiten prüfen.','bad');return}
      upsert('entries',ed);P.lastProject=ed.projectId;P.lastActivity=ed.activityId;saveP();commit();closeSheet();render();toast(`Gespeichert · ${fmtStd(ed.minutes)} · ${fmtEUR(calc(ed).total)}`)});
    if(!orig&&!preset.date)setTimeout(()=>$('#ef-start',w)?.focus(),60)})}

/* =================== Editoren: Stammdaten =================== */
const rateField=(id,val,ph,hint)=>`<div class="field"><label for="${id}">Eigener Stundensatz €</label><input id="${id}" inputmode="decimal" value="${val!=null?fmtNum(val):''}" placeholder="${esc(ph)}"><small>${hint}</small></div>`;
const readRate=v=>{const n=parseNum(v);return isFinite(n)?n:null};
function openCustomerEditor(id){const c=id?cust(id):{name:'',contact:'',street:'',zip:'',city:'',phone:'',email:'',rate:null};
  openSheet(id?'Kunde bearbeiten':'Kunde anlegen',`<form class="form" id="cf" autocomplete="off">
    <div class="field"><label for="cf-name">Name / Firma</label><input id="cf-name" value="${esc(c.name)}"></div>

function openSignature(){const p=proj(curRep.projectId),c=p&&cust(p.customerId);
  openSheet('Unterschrift Auftraggeber',`<div class="form"><p class="muted">Mit der Unterschrift bestätigt der Auftraggeber die aufgeführten Leistungen.</p>
  <div class="sigpad"><canvas id="sig"></canvas><span>Unterschrift</span></div>
  <div class="field"><label for="sig-name">Name des Unterzeichners</label><input id="sig-name" value="${esc(curRep.signerName||c?.contact||c?.name||'')}"></div>
  <div class="sheet-fuss"><button class="btn sek" data-x="clear" type="button">Neu</button><button class="btn" data-x="ok" type="button">Übernehmen</button></div></div>`,w=>{
  const cv=$('#sig',w),ctx=cv.getContext('2d');let drawing=false,dirty=false,last=null;
  const setup=()=>{const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#10203a';ctx.fillStyle='#10203a';dirty=false};
  requestAnimationFrame(setup);
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener('pointerdown',e=>{drawing=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}last=pos(e);ctx.beginPath();ctx.arc(last.x,last.y,1.1,0,7);ctx.fill();dirty=true});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
  const end=()=>{drawing=false};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  w.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;
    if(b.dataset.x==='clear')setup();
    if(b.dataset.x==='ok'){if(!dirty){toast('Im weißen Feld unterschreiben.','bad');return}const name=$('#sig-name',w).value.trim();if(!name){toast('Namen des Unterzeichners eintragen.','bad');$('#sig-name',w).focus();return}
      curRep.signature=shrinkCanvas(cv,600);curRep.signerName=name;curRep.signedAt=Date.now();persistReport();closeSheet();openReport(curRep);toast('Unterschrift gespeichert · '+curRep.number)}})})}
function shrinkCanvas(src,maxW){let w=Math.min(maxW,src.width),q=.8;for(;;){const h=Math.round(src.height*w/src.width),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(src,0,0,w,h);
  let d=c.toDataURL('image/png');if(d.length>40000)d=c.toDataURL('image/jpeg',q);if(d.length<=40000||w<160)return d;w=Math.round(w*.75);q=Math.max(.5,q-.1)}}
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bild'))};i.src=u})}

function toCell(v,ty){switch(ty){case'b':return v?'ja':'nein';case'json':return JSON.stringify(v??[]);case'n?':return v==null||v===''?'':+v;case'n':return+v||0;case'btype':return{h:'Stunden',eur:'Euro'}[v]||'';default:return v??''}}
function fromCell(v,ty){switch(ty){
  case'b':return v===true||/^(ja|j|x|true|1|yes)$/i.test(String(v??'').trim());
  case'json':if(Array.isArray(v))return v;try{return v?JSON.parse(v):[]}catch(e){return[]}

  case'date':{if(typeof v==='number')return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10);const s=String(v??'').trim();const m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:s}

function normEntry(x){if(x.start&&x.end){x.timeMode='range';x.minutes=entryMinutes(x.start,x.end,x.pause)}else x.timeMode='dur';return x}
function normRec(t,rec){const x={};for(const c of t.cols)if(c.k&&c.k!=='updatedAt')x[c.k]=fromCell(toCell(rec[c.k],c.ty),c.ty);if(t.key==='entries')normEntry(x);return JSON.stringify(x)}

  return[t.cols.map(c=>c.h),...[...D[t.key]].sort(sorters[t.key]||((a,b)=>String(a.name).localeCompare(String(b.name)))).map(r=>t.cols.map(c=>c.fn?c.fn(r):toCell(r[c.k],c.ty)))]}
const byName=(list,name)=>{const n=String(name??'').trim().toLowerCase();return n?list.find(x=>String(x.name).trim().toLowerCase()===n):null};
function parseRemote(raw){const out={tables:{},tombs:{},settings:null,logo:null,fresh:new Set(),rowCounts:{},skipped:0,schemaAlt:false};
  for(const title of ALL_TITLES)out.rowCounts[title]=(raw[title]||[]).length;
  const L={};
  for(const t of TABLES){const vals=raw[t.title]||[];const idx={};(vals[0]||[]).forEach((h,i)=>{h=String(h).trim();if(!(h in idx))idx[h]=i});if(vals.length&&JSON.stringify((vals[0]||[]).slice(0,t.cols.length).map(String))!==JSON.stringify(t.cols.map(c=>c.h)))out.schemaAlt=true;
    const recs=[];
    const spalte=c=>{for(const h of [c.h,...(c.alias||[])])if(idx[h]!=null)return idx[h];return null};
    const pos={};for(const c of t.cols)pos[c.h]=spalte(c);
    for(let r=1;r<vals.length;r++){const row=vals[r]||[];if(!row.some(v=>v!==''&&v!=null))continue;
      const cell=(...hs)=>{for(const h of hs){const i=pos[h]??idx[h];if(i!=null&&row[i]!==''&&row[i]!=null)return row[i]}return undefined};
      const rec={};for(const c of t.cols)if(c.k)rec[c.k]=fromCell(pos[c.h]==null?undefined:row[pos[c.h]],c.ty);
      let fresh=false;if(!rec.id){if(t.key==='reports'){out.skipped++;continue}rec.id='m-'+hash(t.key+'|'+JSON.stringify(row));rec.createdAt=rec.createdAt||Date.now();rec.updatedAt=Date.now();fresh=true}
      if(FIX[t.key](rec,cell,fresh,L)===false){out.skipped++;continue}
      if(fresh)out.fresh.add(rec.id);recs.push(rec)}
    out.tables[t.key]=recs;L[t.key]=[...recs,...D[t.key]]}
  const key=Object.fromEntries(TABLES.flatMap(t=>[[t.title,t.key],...(t.alias||[]).map(a=>[a,t.key])]));
  for(const row of(raw[DEL]||[]).slice(1)){const id=String(row[1]??'');const at=+row[2]||0;if(id&&at)out.tombs[id]={t:key[row[0]]||String(row[0]||''),at}}
  for(const row of(raw[SYS]||[]).slice(1)){if(row[0]==='Einstellungen'){try{out.settings=JSON.parse(row[1])}catch(e){}}if(row[0]==='Logo')out.logo={data:String(row[1]||''),updatedAt:+row[2]||0}}
  return out}
const FIX={
  customers:r=>!!r.name,
  activities:(r,cell,fresh)=>{if(!r.name)return false;if(fresh&&cell('Berechnen')===undefined)r.billable=true;return true},
  projects:(r,cell,fresh,L)=>{if(!r.name)return false;if(!r.customerId){const k=String(cell('Kunde')??'').trim();if(k&&k.toLowerCase()!=='intern'){const c=byName(L.customers,k);if(c)r.customerId=c.id}}if(!['offen','pausiert','abgeschlossen'].includes(r.status))r.status=r.status==='läuft'?'offen':'offen';return true},
  entries:(r,cell,fresh,L)=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date))return false;
    if(!r.projectId){const p=byName(L.projects,cell('Auftrag','Projekt'));if(!p)return false;r.projectId=p.id}
    if(!r.activityId){const a=byName(L.activities,cell('Tätigkeit'));r.activityId=a?.id||L.activities[0]?.id||null}
    normEntry(r);if(r.timeMode==='dur'&&!r.minutes){const n=parseNum(cell('Arbeitszeit (Std.)'));if(isFinite(n))r.minutes=Math.round(n*60)}
    if(!['offen','berechnet','bezahlt'].includes(r.status))r.status='offen';
    if(fresh&&cell('Berechnen')===undefined){const a=L.activities.find(x=>x.id===r.activityId),p=L.projects.find(x=>x.id===r.projectId);r.billable=(a?a.billable:true)&&!!p?.customerId}
    return true},
  reports:r=>{r.signerName=r.signerName||'';return true}};
function mergeData(L,R,last){let needWrite=false,changed=false;const now=Date.now();const M={...L,tombs:{...L.tombs}};
  for(const[id,t]of Object.entries(R.tombs)){const lt=M.tombs[id];if(!lt||lt.at<t.at){M.tombs[id]=t;changed=true}}
  for(const[id,t]of Object.entries(M.tombs)){const rt=R.tombs[id];if(!rt||rt.at!==t.at)needWrite=true}
  for(const t of TABLES){const k=t.key,Lm=new Map(L[k].map(r=>[r.id,r])),Rm=new Map((R.tables[k]||[]).map(r=>[r.id,r])),res=[];
    for(const id of new Set([...Lm.keys(),...Rm.keys()])){const l=Lm.get(id),r=Rm.get(id);let w;const lu=l?.updatedAt||0,ru=r?.updatedAt||0;
      if(l&&!r){w=l;needWrite=true}
      else if(!l&&r){w=r;changed=true}
      else if(ru>lu){w=r;changed=true}
      else if(lu>ru){w=l;needWrite=true}
      else if(normRec(t,l)!==normRec(t,r)){if(lu<=last){w={...r,updatedAt:now};changed=true}else w=l;needWrite=true}
      else w=l;
      const tb=M.tombs[id];if(tb&&tb.at>=(w.updatedAt||0)){if(r)needWrite=true;if(l)changed=true;continue}
      res.push(w)}
    M[k]=res}
  const rs=R.settings,lsS=L.settings;
  if(rs&&(rs.updatedAt||0)>(lsS.updatedAt||0)){M.settings={...lsS,...rs};changed=true}
  else if(!rs||JSON.stringify(rs)!==JSON.stringify(lsS))needWrite=true;
  const seq=Math.max(lsS.reportSeq||1,rs?.reportSeq||1);if(M.settings.reportSeq!==seq){M.settings={...M.settings,reportSeq:seq};changed=true;needWrite=true}
  const rl=R.logo;if(rl&&rl.updatedAt>(L.logo.updatedAt||0)){M.logo=rl;changed=true}else if(!rl||rl.updatedAt!==(L.logo.updatedAt||0))needWrite=true;
  if(R.fresh.size)needWrite=true;
  return{data:M,needWrite,changed}}

async function api(method,url,body){if(!tokenValid())throw new AuthNeeded();let r;
  try{r=await fetch(url,{method,headers:{Authorization:'Bearer '+C.token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined})}catch(e){throw new Offline()}
  if(r.status===401){C.token=null;saveC();throw new AuthNeeded()}
  if(!r.ok){let m='';try{m=(await r.json()).error?.message||''}catch(e){}
    const err=new Error(r.status===404?'Tabelle in Google Drive nicht gefunden. Gelöscht oder Freigabe entzogen?':r.status===403?'Kein Zugriff auf die Tabelle. Freigabe beim Inhaber prüfen.':r.status===429?'Google meldet zu viele Anfragen. Abgleich später.':`Google meldet Fehler ${r.status}${m?': '+m:''}`);err.status=r.status;throw err}
  const tx=await r.text();return tx?JSON.parse(tx):null}

      C.token=r.access_token;C.exp=Date.now()+((+r.expires_in||3600)-120)*1000;saveC();res()},
    error_callback:e=>rej(new Error(e?.type==='popup_closed'?(KONFIG.testbetrieb?`Anmeldung abgebrochen. Im Testbetrieb muss die Google-Adresse vorher freigeschaltet werden: ${KONFIG.anbieterEmail}`:'Anmeldung abgebrochen.'):e?.type==='popup_failed_to_open'?'Anmeldefenster blockiert. Pop-ups für diese Seite erlauben und erneut tippen.':'Anmeldung fehlgeschlagen.'))});

  await api('PATCH',`${DRIVE}/${s.spreadsheetId}?fields=id`,{appProperties:{stundenwerk:'daten'}});
  try{await api('POST',`${SHEETS}/${s.spreadsheetId}:batchUpdate`,{requests:ALL_TITLES.map((t,i)=>({repeatCell:{range:{sheetId:i+1,startRowIndex:0,endRowIndex:1},cell:{userEnteredFormat:{textFormat:{bold:true},backgroundColor:{red:.99,green:.88,blue:.6}}},fields:'userEnteredFormat(textFormat,backgroundColor)'}}))})}catch(e){}
  return{id:s.spreadsheetId,webViewLink:s.spreadsheetUrl,ownedByMe:true,shared:false,owners:[{displayName:C.name,emailAddress:C.email}],neu:true}}
let sheetsChecked=false;
async function ensureSheets(){if(sheetsChecked)return;
  const f=await api('GET',`${DRIVE}/${C.sheetId}?fields=${encodeURIComponent(DATEI_FELDER)}`);
  C.ownedByMe=f.ownedByMe!==false;C.shared=!!f.shared;C.ownerName=f.owners?.[0]?.displayName||f.owners?.[0]?.emailAddress||'';if(f.webViewLink)C.sheetUrl=f.webViewLink;saveC();
  const meta=await api('GET',`${SHEETS}/${C.sheetId}?fields=sheets.properties(sheetId,title)`);
  const have=new Map((meta.sheets||[]).map(s=>[s.properties.title,s.properties.sheetId]));const req=[];
  for(const t of TABLES)if(!have.has(t.title)){const alt=(t.alias||[]).find(a=>have.has(a));if(alt){req.push({updateSheetProperties:{properties:{sheetId:have.get(alt),title:t.title},fields:'title'}});have.set(t.title,have.get(alt))}}
  for(const t of ALL_TITLES)if(!have.has(t))req.push({addSheet:{properties:{title:t,gridProperties:{frozenRowCount:1}}}});
  if(req.length)await api('POST',`${SHEETS}/${C.sheetId}:batchUpdate`,{requests:req});
  sheetsChecked=true}
async function readRemote(){const qs=ALL_TITLES.map(t=>'ranges='+encodeURIComponent(qn(t))).join('&');
  const res=await api('GET',`${SHEETS}/${C.sheetId}/values:batchGet?${qs}&valueRenderOption=UNFORMATTED_VALUE`);const out={};ALL_TITLES.forEach((t,i)=>out[t]=res.valueRanges?.[i]?.values||[]);return out}
async function writeRemote(counts){const padTo=(rows,n,w)=>{while(rows.length<n)rows.push(Array(w).fill(''));return rows};const data=[];
  for(const t of TABLES)data.push({range:qn(t.title)+'!A1',values:padTo(rowsFor(t),counts[t.title]||0,t.cols.length)});
  const keyTitle=Object.fromEntries(TABLES.map(t=>[t.key,t.title]));
  data.push({range:qn(DEL)+'!A1',values:padTo([['Tabelle','ID','Gelöscht am'],...Object.entries(D.tombs).map(([id,t])=>[keyTitle[t.t]||t.t,id,t.at])],counts[DEL]||0,3)});
  data.push({range:qn(SYS)+'!A1',values:padTo([['Eintrag','Wert','Geändert'],['Hinweis',`Diese Tabelle wird von ${KONFIG.appName} verwaltet (${appUrl()}). Neue Zeilen im Blatt „Zeiten“ unten anfügen: Datum, Von, Bis, Pause, Auftrag, Tätigkeit. Spalten ab „ID“ nicht ändern. Löschen bitte in der App.`,''],['Einstellungen',JSON.stringify(D.settings),D.settings.updatedAt||0],['Logo',D.logo.data||'',D.logo.updatedAt||0]],counts[SYS]||0,3)});
  await api('POST',`${SHEETS}/${C.sheetId}/values:batchUpdate`,{valueInputOption:'RAW',data})}
let syncing=false,syncAgain=false,syncTimer=null,pruefTimer=null;
const imTeam=()=>cloudOn()&&(!C.ownedByMe||C.shared);
function setSync(s){C.status=s;renderSyncChip();const el=$('#cloud-state');if(el)el.innerHTML=cloudStateHtml()}
function scheduleSync(delay=2500){if(!cloudOn())return;clearTimeout(syncTimer);if(C.status==='ok'||C.status==='off')setSync('pending');syncTimer=setTimeout(sync,delay)}
async function sync(){if(!cloudOn())return;if(syncing){syncAgain=true;return}clearTimeout(syncTimer);if(!tokenValid()){setSync('auth');return}
  syncing=true;setSync('busy');const started=Date.now();let geschrieben=false;
  try{await ensureSheets();const raw=await readRemote();const remote=parseRemote(raw);const m=mergeData(D,remote,C.lastSyncAt||0);
    D=m.data;D.sample=false;save();if(m.needWrite||remote.schemaAlt){await writeRemote(remote.rowCounts);geschrieben=true}
    C.lastSyncAt=started;C.error='';saveC();setSync('ok');
    if(m.changed&&$('#sheet').hidden&&$('#report').hidden)render();else if(m.changed)renderSyncChip();
    if(remote.skipped)toast(`${remote.skipped} Zeilen der Google-Tabelle nicht lesbar (z. B. Auftrag unbekannt).`,'bad');
    /* Im Team: kurz danach erneut prüfen, falls zeitgleich ein anderes Gerät geschrieben hat */
    if(geschrieben&&imTeam()){clearTimeout(pruefTimer);pruefTimer=setTimeout(()=>{if(!syncing)sync()},12000)}}
  catch(e){if(e instanceof AuthNeeded)setSync('auth');else if(e instanceof Offline)setSync('offline');else{C.error=e.message;saveC();setSync('error');if(e.status===404||e.status===403)sheetsChecked=false}}
  finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync(400)}}}

/* ---- Verbinden, Tabelle wählen, Team ---- */
function hatEigeneDaten(){return!D.sample&&(D.entries.length||D.projects.length||D.customers.length)}
async function verbinden(){
  if(!isWeb()){toast('Google Drive nur über die Internetadresse der App möglich, nicht als lokale Datei.','bad');return}
  if(!clientId()){toast('Google-Anbindung ist noch nicht eingerichtet.','bad');return}
  try{setSync('busy');await requestToken();await kontoLaden();
    const dateien=await stundenwerkDateien();
    if(dateien.length===1&&!cloudOn())await tabelleVerwenden(dateien[0]);
    else{if(!cloudOn())setSync('off');openTabellenWahl(dateien)}}
  catch(e){if(!cloudOn())setSync('off');else setSync('error');toast(e.message,'bad')}}
function dateiBesitzer(f){return f.ownedByMe?'eigene Tabelle':`von ${f.owners?.[0]?.displayName||f.owners?.[0]?.emailAddress||'unbekannt'}`}
function openTabellenWahl(dateien){
  openSheet('Tabelle wählen',`<div class="stack eng" style="margin-bottom:20px">
    ${dateien.length?`<span class="lbl">Gefundene Tabellen</span><div class="liste">${dateien.map(f=>`<div class="eintrag ${f.id===C.sheetId?'laufend':'plain'}" data-act="tabelle-nehmen" data-id="${f.id}" role="button" tabindex="0"><div class="e-main"><b>${esc(f.name)}</b><small>${esc(dateiBesitzer(f))}${f.id===C.sheetId?' · aktuell verbunden':''}</small></div>${Is('right')}</div>`).join('')}</div>`:'<p class="muted">Keine Tabelle gefunden.</p>'}
    <span class="lbl" style="margin-top:8px">Eigener Betrieb</span>
    <button class="btn sek breit" data-act="tabelle-neu">Neue Tabelle anlegen</button>
    <span class="lbl" style="margin-top:8px">Mitarbeiter</span>
    ${pickerBereit()?`<button class="btn sek breit" data-act="tabelle-picker">Freigegebene Tabelle des Betriebs öffnen</button><small class="muted">Der Inhaber muss die Tabelle vorher für deine Google-Adresse freigeben (Betrieb › Team).</small>`:'<p class="muted" style="font-size:14px">Freigegebene Tabellen öffnen ist noch nicht eingerichtet (API-Schlüssel fehlt).</p>'}
  </div>`);
  ACT['tabelle-nehmen']=b=>{const f=dateien.find(x=>x.id===b.dataset.id);closeSheet();if(f)tabelleVerwenden(f)}}
async function tabelleNeu(){try{closeSheet();if(!tokenValid())await requestToken();setSync('busy');const f=await createSpreadsheet();await tabelleVerwenden(f)}catch(e){setSync(cloudOn()?'error':'off');toast(e.message,'bad')}}
async function tabellePicker(){try{closeSheet();if(!tokenValid())await requestToken();await ladePicker();
  const id=await new Promise(res=>{const v=new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setOwnedByMe(false).setMode(google.picker.DocsViewMode.LIST);
    new google.picker.PickerBuilder().addView(v).setOAuthToken(C.token).setDeveloperKey(apiKey()).setAppId(projektNr()).setLocale('de').setTitle('Freigegebene Tabelle wählen')
      .setCallback(d=>{if(d.action===google.picker.Action.PICKED)res(d.docs?.[0]?.id||null);else if(d.action===google.picker.Action.CANCEL)res(null)}).build().setVisible(true)});
  if(!id)return;
  const f=await api('GET',`${DRIVE}/${id}?fields=${encodeURIComponent(DATEI_FELDER)}`);
  if(f.appProperties?.stundenwerk!=='daten'){toast(`Diese Tabelle stammt nicht aus ${KONFIG.appName}. Bitte die Tabelle des Betriebs wählen.`,'bad');return}
  await tabelleVerwenden(f)}catch(e){toast(e.message,'bad');if(!cloudOn())setSync('off')}}
async function tabelleVerwenden(f){
  if(cloudOn()&&f.id===C.sheetId){sync();return}
  if(D.sample){D=defaults();save()}
  else if(hatEigeneDaten()&&!f.neu){const n=D.entries.length;
    const wahl=await auswahlDialog(`Auf diesem Gerät sind schon Daten (${n} Einträge). Was soll damit passieren?`,[{label:'In die gewählte Tabelle übernehmen',wert:'mitnehmen',art:''},{label:'Verwerfen, nur Daten der Tabelle nutzen',wert:'verwerfen',art:'sek'},{label:'Abbrechen',wert:null,art:'sek'}],true);
    if(!wahl){setSync(cloudOn()?'ok':'off');return}
    if(wahl==='verwerfen'){if(!await confirmBox('Daten dieses Geräts wirklich verwerfen?','Verwerfen',true)){setSync(cloudOn()?'ok':'off');return}D=defaults();save()}}
  C.sheetId=f.id;C.sheetUrl=f.webViewLink||`https://docs.google.com/spreadsheets/d/${f.id}/edit`;C.ownedByMe=f.ownedByMe!==false;C.shared=!!f.shared;C.ownerName=f.owners?.[0]?.displayName||'';C.lastSyncAt=0;C.error='';saveC();sheetsChecked=false;
  if(!P.worker&&C.name){P.worker=C.name.split(' ')[0];saveP()}
  await sync();render();
  if(C.status==='ok')toast(f.neu?'Neue Tabelle in Google Drive angelegt.':C.ownedByMe?'Verbunden. Daten abgeglichen.':`Verbunden mit der Tabelle von ${C.ownerName||'deinem Betrieb'}.`);
  else toast(C.error||'Verbunden, Abgleich noch nicht erfolgreich.','bad')}
async function reauth(){try{await requestToken();await sync()}catch(e){toast(e.message,'bad');setSync('auth')}}
function trennen(){try{if(C.token&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(C.token,()=>{})}catch(e){}
  C={...C,sheetId:null,sheetUrl:'',email:'',name:'',ownerName:'',ownedByMe:true,shared:false,token:null,exp:0,lastSyncAt:0,error:'',status:'off'};saveC();sheetsChecked=false;render();toast('Verbindung getrennt. Daten bleiben auf dem Gerät und in der Tabelle.')}
/* Team: Freigaben der eigenen Tabelle anzeigen, einladen, entfernen */
async function teamLaden(){const el=$('#team-liste');if(!el||!cloudOn()||!C.ownedByMe)return;if(!tokenValid()){el.innerHTML='<p class="muted">Zum Anzeigen bei Google anmelden.</p>';return}
  try{const r=await api('GET',`${DRIVE}/${C.sheetId}/permissions?fields=${encodeURIComponent('permissions(id,type,role,emailAddress,displayName)')}`);
    const ps=(r.permissions||[]).filter(p=>p.role!=='owner');C.shared=ps.length>0;saveC();
    el.innerHTML=ps.length?`<div class="liste">${ps.map(p=>`<div class="eintrag plain"><div class="e-main"><b>${esc(p.displayName||p.emailAddress||'Freigabe')}</b><small>${esc(p.emailAddress||p.type)} · ${p.role==='writer'?'kann erfassen':p.role}</small></div><button class="btn gefahr klein" data-act="team-entfernen" data-id="${p.id}" data-name="${esc(p.displayName||p.emailAddress||'')}">Entfernen</button></div>`).join('')}</div>`:'<p class="muted">Noch niemand eingeladen.</p>'}
  catch(e){el.innerHTML=`<p class="muted">${esc(e.message)}</p>`}}
async function teamEinladen(){const inp=$('#team-mail');const mail=(inp?.value||'').trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){toast('Gültige E-Mail-Adresse eintragen.','bad');inp?.focus();return}
  try{if(!tokenValid())await requestToken();
    const text=`${D.settings.name||C.name||'Dein Betrieb'} nutzt ${KONFIG.appName} zur Zeiterfassung. So erfasst du deine Zeiten: 1. ${appUrl()} öffnen. 2. „Mit Google Drive verbinden“ tippen und mit dieser Google-Adresse anmelden. 3. „Freigegebene Tabelle des Betriebs öffnen“ wählen und diese Tabelle auswählen.`;
    await api('POST',`${DRIVE}/${C.sheetId}/permissions?sendNotificationEmail=true&emailMessage=${encodeURIComponent(text)}`,{type:'user',role:'writer',emailAddress:mail});
    inp.value='';C.shared=true;saveC();toast(`${mail} eingeladen. Google schickt eine E-Mail mit Anleitung.`);teamLaden()}
  catch(e){toast(e.status===400?'Einladung nicht möglich. Ist das eine Google-Adresse (z. B. Gmail)?':e.message,'bad')}}
async function teamEntfernen(b){if(!await confirmBox(`Zugriff für ${b.dataset.name||'diese Person'} entfernen? Sie kann danach keine Zeiten mehr in diese Tabelle eintragen.`,'Entfernen',true))return;
  try{await api('DELETE',`${DRIVE}/${C.sheetId}/permissions/${b.dataset.id}`);toast('Zugriff entfernt.');teamLaden()}catch(e){toast(e.message,'bad')}}

const SYNC_UI={ok:['ok','Gespeichert','cloud'],busy:['busy','Speichert …','cloud'],pending:['busy','Speichert …','cloud'],offline:['warn','Offline','cloudOff'],auth:['warn','Anmelden','cloudOff'],error:['bad','Sync-Fehler','cloudOff'],off:['ok','Gespeichert','cloud']};
function renderSyncChip(){const el=$('#sync-chip');if(!cloudOn()){el.hidden=true;return}const[cls,l,ic]=SYNC_UI[C.status]||SYNC_UI.ok;el.hidden=false;el.className='hchip sync-chip '+cls;el.innerHTML=`${Is(ic)}<span>${l}</span>`;el.title='Google Drive: '+l;el.setAttribute('aria-label','Google Drive: '+l)}
